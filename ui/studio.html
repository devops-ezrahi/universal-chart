/* ---------- state ---------- */
const BYID={};FEAT.forEach(f=>BYID[f.id]=f);
const clone=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
const state={mode:'single',sel:'workload',tab:'files',file:0,view:'feature',
  f:{},fleet:{ns:[{name:'dev'},{name:'staging'},{name:'prod'}],rows:[],release:'checkout-api'}};

function fv(id){const s=state.f[id];return s&&s.v?s.v:{};}
function on(id){return !!(state.f[id]&&state.f[id].on);}
function ensure(id){if(!BYID[id])return {on:false,v:{}};if(!state.f[id])state.f[id]={on:false,v:defaults(id)};return state.f[id];}
function defaults(id){const v={};if(!BYID[id])return v;(BYID[id].fields||[]).forEach(f=>{if(f.def!==undefined)v[f.k]=f.def;
  if(f.t==='rows')v[f.k]=[];if(f.t==='kv')v[f.k]=[];});return v;}
function setOn(id,val){ensure(id).on=val;save();}
function relName(){return (on('identity')&&fv('identity').nameOverride)||'<release>';}

function save(){try{localStorage.setItem('ucstudio.v1',JSON.stringify({f:state.f,fleet:state.fleet,mode:state.mode}));}catch(x){}}
function load(){try{const r=JSON.parse(localStorage.getItem('ucstudio.v1'));
  if(r&&r.f){state.f=r.f;if(r.fleet)state.fleet=r.fleet;if(r.mode)state.mode=r.mode;return true;}}catch(x){}return false;}

/* ---------- build ---------- */
function buildDoc(){
  const doc={},owners={};
  FEAT.forEach(f=>{if(!on(f.id))return;
    let frag=null;try{frag=f.emit(fv(f.id));}catch(x){frag=null;}
    if(!frag)return;
    Object.keys(frag).forEach(k=>{(owners[k]=owners[k]||[]).push(f.id);});
    deepMerge(doc,frag);});
  return {doc,owners};
}
function orderKeys(doc){
  const order=[];FEAT.forEach(f=>(f.keys||[]).forEach(k=>{if(order.indexOf(k)<0)order.push(k);}));
  const out={};order.forEach(k=>{if(k in doc)out[k]=doc[k];});
  Object.keys(doc).forEach(k=>{if(!(k in out))out[k]=doc[k];});
  return out;
}
function serialize(doc,owners){
  const ord=orderKeys(doc),text=[],marks=[];
  Object.keys(ord).forEach(k=>{
    const start=text.length;
    emitNode({[k]:ord[k]},0,text);
    marks.push({from:start,to:text.length-1,ids:owners[k]||[]});
    text.push('');
  });
  while(text.length&&text[text.length-1]==='')text.pop();
  return {text:text.join('\n'),marks};
}

/* ---------- fleet ---------- */
function overridePaths(){
  const out=[];
  FEAT.forEach(f=>{if(!on(f.id))return;
    (f.fields||[]).forEach(fd=>{if(fd.p)out.push({path:fd.p,label:f.name});});});
  ['replicaCount','image.tag','image.repository','ingress.className','service.type',
   'hpa.minReplicas','hpa.maxReplicas','resources.requests.cpu','resources.requests.memory',
   'resources.limits.cpu','resources.limits.memory','nameOverride'].forEach(p=>{
    if(!out.find(x=>x.path===p))out.push({path:p,label:'common'});});
  return out;
}
function coerce(s){
  if(s==='true')return true;if(s==='false')return false;
  if(/^-?\d+$/.test(s))return Number(s);
  return s;
}
function fleetFiles(){
  const {doc,owners}=buildDoc();
  const base=serialize(doc,owners);
  const files=[{name:'values.yaml',text:base.text,marks:base.marks,sub:'base — everything shared'}];
  state.fleet.ns.forEach(n=>{
    if(!nz(n.name))return;
    const o={};let count=0;
    state.fleet.rows.forEach(r=>{
      if(!nz(r.path))return;
      const val=(r.vals||{})[n.name];
      if(!nz(val))return;
      setPath(o,r.path,coerce(String(val)));count++;});
    let txt=Object.keys(o).length?toYaml(o):'';
    if(nz(n.extra))txt=(txt?txt+'\n':'')+String(n.extra).replace(/\s+$/,'');
    const head='# '+n.name+' — overrides only. Everything else comes from values.yaml.';
    files.push({name:'values-'+n.name+'.yaml',text:head+'\n'+(txt||'{}'),marks:[],
      sub:count+' override'+(count===1?'':'s')});
  });
  const rel=state.fleet.release||'myapp';
  const cmds=['#!/usr/bin/env bash','set -euo pipefail','','CHART=./Universal-chart',''];
  state.fleet.ns.forEach(n=>{if(!nz(n.name))return;
    cmds.push('helm upgrade --install '+(n.release||rel)+' "$CHART" \\');
    cmds.push('  --namespace '+n.name+' --create-namespace \\');
    cmds.push('  -f values.yaml -f values-'+n.name+'.yaml');
    cmds.push('');});
  const cl=FEAT.filter(f=>f.cluster&&on(f.id)).flatMap(f=>{try{return f.renders(fv(f.id));}catch(x){return [];}})
    .filter(r=>r.scope==='cluster');
  if(cl.length){
    cmds.push('# Cluster-scoped objects below are owned by ONE release, not one per namespace.');
    cl.forEach(r=>cmds.push('#   '+r.kind+'/'+r.name));
    cmds.push('# Move them into a single shared release and drop them from the per-namespace ones.');
  }
  files.push({name:'deploy.sh',text:cmds.join('\n'),marks:[],sub:state.fleet.ns.filter(n=>nz(n.name)).length+' namespaces'});
  return files;
}
function currentFiles(){
  if(state.mode==='fleet')return fleetFiles();
  const {doc,owners}=buildDoc();
  const s=serialize(doc,owners);
  return [{name:'values.yaml',text:s.text||'# nothing enabled yet — pick a feature from the index',marks:s.marks,sub:''}];
}

/* ---------- renders & checks ---------- */
function allRenders(){
  const out=[];
  FEAT.forEach(f=>{if(!on(f.id))return;
    let r=[];try{r=f.renders(fv(f.id))||[];}catch(x){r=[];}
    r.forEach(x=>out.push(Object.assign({from:f.id},x)));});
  return out;
}
function checks(){
  const out=[],wt=on('workload')?(fv('workload').type||'deployment'):'deployment';
  const enabled=id=>on(id)&&fv(id).enabled!==false;
  if(wt==='none'){
    ['hpa','vpa','pdb'].forEach(k=>{if(enabled(k))
      out.push({l:'bad',t:'<b>'+k+'.enabled with workload.type: none</b> fails the chart’s own validation — there are no pods to scale, resize or protect. Disable it or pick a real workload type.'});});
    if(on('service')&&fv('service').enabled!==false)
      out.push({l:'warn',t:'A Service with <code>workload.type: none</code> selects nothing. Set <code>service.enabled: false</code> unless you supply your own <code>selector</code>.'});
  }
  if(enabled('ingress')&&enabled('route'))
    out.push({l:'bad',t:'<b><code>ingress.enabled</code> and <code>route.enabled</code> cannot both be true.</b> The chart fails the render — pick the Kubernetes Ingress or the OpenShift Route, not both.'});
  if(enabled('hpa')&&wt==='daemonset')
    out.push({l:'bad',t:'<b>HPA is not supported for a DaemonSet.</b> Pod count is one per node by definition; the chart fails the render.'});
  const svcP=Object.keys(parsePorts(fv('service').ports)||{});
  if(enabled('ingress')&&!svcP.length&&(fv('ingress').hosts||[]).some(r=>nz(r.host)&&!nz(r.portName)))
    out.push({l:'bad',t:'<b>An Ingress path with no <code>portName</code> and no Service ports</b> leaves the backend port blank — the chart fails the render. Name a port on the Service, or set <code>portName</code>.'});
  if(enabled('route')&&!nz(fv('route').targetPort)&&!svcP.length)
    out.push({l:'bad',t:'<b><code>route.targetPort</code> is unset and the Service has no ports.</b> The Route target port would be blank; the chart fails the render.'});
  if(enabled('hpa')&&on('replicas')&&nz(fv('replicas').replicaCount))
    out.push({l:'warn',t:'<b>Both <code>replicaCount</code> and HPA are set.</b> Every sync writes the replica count back and the HPA scales it away again. Drop <code>replicaCount</code>.'});
  if(enabled('hpa')&&nz(fv('hpa').cpu)&&!(on('resources')&&nz(fv('resources').rcpu)))
    out.push({l:'warn',t:'A CPU-target HPA needs <code>resources.requests.cpu</code> — utilisation is a percentage of the request.'});
  if(enabled('hpa')&&nz(fv('hpa').cpu)&&enabled('vpa'))
    out.push({l:'bad',t:'<b>CPU-target HPA and VPA on the same workload fight each other.</b> Use HPA for pod count, VPA for a single pod’s size — not both on CPU.'});
  if(on('vct')&&wt!=='statefulset')
    out.push({l:'bad',t:'<code>volumeClaimTemplates</code> is StatefulSet-only. With <code>workload.type: '+wt+'</code> it renders nothing.'});
  if(on('vct')&&!nz(fv('vct').whenDeleted))
    out.push({l:'warn',t:'No <code>persistentVolumeClaimRetentionPolicy</code>. Kubernetes defaults to <b>Delete</b>, so deleting the StatefulSet deletes the data.'});
  if(wt==='statefulset'&&on('service')&&fv('service').clusterIP!=='None'&&!on('services'))
    out.push({l:'warn',t:'A StatefulSet with no headless Service has no per-pod DNS. Set <code>service.clusterIP: None</code>, or add a headless entry under Extra Services.'});
  if(on('pdb')&&on('replicas')&&nz(fv('pdb').minAvailable)&&String(fv('pdb').minAvailable)===String(fv('replicas').replicaCount))
    out.push({l:'bad',t:'<b><code>pdb.minAvailable</code> equals <code>replicaCount</code></b> — no pod can ever be evicted and node drains hang forever.'});
  const pvcRWO=(fv('pvc').items||[]).filter(r=>nz(r.name)&&(r.accessMode||'ReadWriteOnce')==='ReadWriteOnce');
  if(on('pvc')&&pvcRWO.length&&Number(fv('replicas').replicaCount||1)>1&&wt==='deployment')
    out.push({l:'bad',t:'<b>A ReadWriteOnce PVC shared by '+fv('replicas').replicaCount+' replicas.</b> The second pod stays Pending. Use ReadWriteMany, or a StatefulSet with volumeClaimTemplates.'});
  if(on('security')&&fv('security').readOnlyRootFilesystem){
    const hasTmp=(fv('mounts').items||[]).some(r=>String(r.mountPath||'').startsWith('/tmp'));
    if(!hasTmp)out.push({l:'warn',t:'<code>readOnlyRootFilesystem: true</code> with nothing mounted at <code>/tmp</code>. Most runtimes fail on their first temp file — add an <code>emptyDir</code>.'});
  }
  if(on('hostns')&&fv('hostns').hostNetwork&&fv('hostns').dnsPolicy!=='ClusterFirstWithHostNet')
    out.push({l:'bad',t:'<b><code>hostNetwork: true</code> without <code>dnsPolicy: ClusterFirstWithHostNet</code></b> — the pod uses the node’s resolver and no Service name resolves.'});
  if(on('servicemonitor')&&fv('servicemonitor').enabled!==false&&!kvOf(fv('servicemonitor').labels))
    out.push({l:'warn',t:'ServiceMonitor with no <code>labels</code>. Prometheus Operator selects on them — usually <code>release: prometheus</code> — so an unlabelled one is silently never scraped.'});
  const smPort=fv('servicemonitor').port,svcPorts=Object.keys(parsePorts(fv('service').ports)||{});
  if(on('servicemonitor')&&nz(smPort)&&on('service')&&svcPorts.length&&svcPorts.indexOf(smPort)<0)
    out.push({l:'warn',t:'ServiceMonitor scrapes port <code>'+e(smPort)+'</code>, which is not one of the Service ports ('+svcPorts.map(p=>'<code>'+e(p)+'</code>').join(', ')+').'});
  const mounted=(fv('mounts').items||[]).map(r=>r.name).filter(nz);
  const defined=(fv('volumes').items||[]).map(r=>r.name).filter(nz)
    .concat((fv('vct').items||[]).map(r=>r.name).filter(nz));
  mounted.forEach(m=>{if(defined.indexOf(m)<0&&on('mounts'))
    out.push({l:'bad',t:'Mount <code>'+e(m)+'</code> has no matching volume or volumeClaimTemplate. The pod will not start.'});});
  const wanted=[...(fv('cronjobs').items||[]).map(r=>r.serviceAccountName),
    ...(fv('jobs').items||[]).map(r=>r.serviceAccountName)].filter(nz);
  if(wanted.length){
    const made=[];
    if(on('serviceaccount')&&fv('serviceaccount').create!==false)made.push(fv('serviceaccount').name||relName());
    (fv('extradeploy').items||[]).forEach(r=>{const b=String(r.body||'');
      if(/^kind:\s*ServiceAccount\s*$/m.test(b)){const n=(b.match(/^\s{2}name:\s*(.+)$/m)||[])[1];if(n)made.push(n.trim());}});
    const dangling=[...new Set(wanted.filter(n=>made.indexOf(n)<0))];
    if(dangling.length)out.push({l:'warn',t:'<b>'+dangling.map(n=>'<code>'+e(n)+'</code>').join(', ')+
      ' is named as a <code>serviceAccountName</code> but nothing in this release creates it.</b> The chart models exactly one ServiceAccount — anything else has to come from <a href="#" data-goto="extradeploy">extraDeploy</a> or another release. Helm renders this happily; the pod fails to schedule.'});
  }
  const clusterScoped=allRenders().filter(r=>r.scope==='cluster');
  if(clusterScoped.length&&state.mode==='fleet')
    out.push({l:'warn',t:'<b>'+clusterScoped.length+' cluster-scoped object'+(clusterScoped.length===1?'':'s')+' in a multi-namespace build.</b> '+
      clusterScoped.map(r=>'<code>'+e(r.kind)+'/'+e(r.name)+'</code>').join(', ')+' — every namespace would own the same object. Move them into one shared release.'});
  else if(clusterScoped.length)
    out.push({l:'warn',t:'Cluster-scoped: '+clusterScoped.map(r=>'<code>'+e(r.kind)+'/'+e(r.name)+'</code>').join(', ')+'. Only one release in the cluster may own these.'});
  if(!on('image')&&on('workload')&&wt!=='none')
    out.push({l:'bad',t:'No <code>image.repository</code>. The schema requires it for any workload that runs pods.'});
  if(!out.length)out.push({l:'ok',t:'Nothing to flag. Every cross-check the cookbook documents passes on this build.'});
  return out;
}

/* ---------- field editors ---------- */
function ctl(fid,fd,val,pre){
  const a='data-f="'+fid+'" '+(pre||'')+' data-k="'+fd.k+'"';

  if(fd.t==='bool')return '<label class="chk"><input type="checkbox" '+a+(val?' checked':'')+'> '+fd.label+'</label>';
  if(fd.t==='sel')return '<select class="inp" '+a+'>'+fd.opts.map(o=>
      '<option value="'+e(o)+'"'+(String(val||'')===o?' selected':'')+'>'+(o===''?'—':e(o))+'</option>').join('')+'</select>';
  if(fd.t==='yaml'||fd.t==='txt')return '<textarea class="inp" rows="'+(fd.rows||4)+'" '+a+ph+'>'+e(val==null?'':val)+'</textarea>';
  return '<input class="inp" type="'+(fd.t==='num'?'number':'text')+'" '+a+ph+' value="'+e(val==null?'':val)+'">';
}
function fieldHTML(fid,fd,v){

  if(fd.t==='kv'){
    const arr=Array.isArray(val)?val:[];
    return '<div class="field"><label>'+e(fd.label)+'</label>'+
      arr.map((p,i)=>'<div class="kvrow">'+
        '<input class="inp" data-f="'+fid+'" data-k="'+fd.k+'" data-kvi="'+i+'" data-part="k" placeholder="key" value="'+e(p.k||'')+'">'+
        '<input class="inp" data-f="'+fid+'" data-k="'+fd.k+'" data-kvi="'+i+'" data-part="v" placeholder="value" value="'+e(p.v||'')+'">'+
        '<button class="x" data-act="kvdel" data-f="'+fid+'" data-k="'+fd.k+'" data-kvi="'+i+'" title="Remove">&times;</button></div>').join('')+
      '<button class="add" data-act="kvadd" data-f="'+fid+'" data-k="'+fd.k+'">+ Add pair</button>'+
      (fd.hint?'<div class="hint">'+fd.hint+'</div>':'')+'</div>';
  }
  if(fd.t==='rows'){
    const arr=Array.isArray(val)?val:[];
    return '<div class="field"><label>'+e(fd.label)+'</label><div class="rows">'+
      arr.map((r,i)=>{
        const cols=fd.cols.filter(c=>!c.when||c.when(r));
        return '<div class="row"><div class="rowhd"><span class="ix">'+String(i+1).padStart(2,'0')+'</span>'+
          '<span class="sp"></span><button class="x" data-act="rowdel" data-f="'+fid+'" data-k="'+fd.k+'" data-ri="'+i+'" title="Remove">&times;</button></div>'+
          '<div class="grid2">'+cols.map(c=>'<div'+(c.t==='yaml'||c.t==='txt'?' style="grid-column:1/-1"':'')+'>'+
            (c.t==='bool'?'':'<span class="flabel">'+e(c.label)+'</span>')+
            ctl(fid,c,r[c.k],'data-ri="'+i+'" data-fk="'+fd.k+'"')+
            (c.hint?'<div class="hint">'+c.hint+'</div>':'')+'</div>').join('')+'</div></div>';
      }).join('')+
      '</div><button class="add" data-act="rowadd" data-f="'+fid+'" data-k="'+fd.k+'" style="margin-top:10px">+ '+e(fd.add||'Add')+'</button></div>';
  }
  return '<div class="field"><label>'+e(fd.label)+'</label>'+ctl(fid,fd,val)+(fd.hint?'<div class="hint">'+fd.hint+'</div>':'')+'</div>';
}

/* ---------- rail ---------- */
function renderRail(){
  const q=($('#q').value||'').toLowerCase().trim();
  const host=$('#rail');let h='';
  if(state.mode==='fleet'){
    h+='<div class="grp">Fleet</div>'+
      '<div class="item'+(state.view==='fleet'?'':'')+'" data-goto="__fleet" aria-current="'+(state.view==='fleet')+'">'+
      '<span></span><span class="sec">ns</span><span class="nm">Namespaces &amp; overrides</span></div>';
  }
  CATS.forEach(c=>{
    const fs=FEAT.filter(f=>f.cat===c.id&&(!q||(f.name+' '+f.kw+' '+(f.keys||[]).join(' ')+' §'+f.sec).toLowerCase().includes(q)));
    if(!fs.length)return;
    const n=fs.filter(f=>on(f.id)).length;
    h+='<div class="grp">'+e(c.name)+(n?'<span>'+n+'</span>':'')+'</div>';
    fs.forEach(f=>{
      h+='<div class="item'+(on(f.id)?' on':'')+'" data-goto="'+f.id+'" aria-current="'+(state.view==='feature'&&state.sel===f.id)+'">'+
        '<button class="tog" data-act="toggle" data-id="'+f.id+'" title="'+(on(f.id)?'Remove from values':'Add to values')+'" aria-label="'+(on(f.id)?'Remove ':'Add ')+e(f.name)+'">'+
        '<svg viewBox="0 0 12 12"><polyline points="1,6 4.5,9.5 11,2.5"/></svg></button>'+
        '<span class="sec">'+(f.sec==='--'?'·':'§'+f.sec)+'</span><span class="nm">'+e(f.name)+'</span></div>';
    });
  });
  if(!h)h='<div class="empty">Nothing matches “'+e(q)+'”.</div>';
  host.innerHTML=h;
}

/* ---------- plate ---------- */
function renderPlate(){
  const host=$('#plate');
  if(state.view==='presets')return void(host.innerHTML=presetsHTML());
  if(state.view==='fleet')return void(host.innerHTML=fleetHTML());
  const f=BYID[state.sel]||FEAT[0];const v=fv(f.id);const isOn=on(f.id);
  let h='<div class="plate-in"><div class="eyebrow">'+
    (f.sec==='--'?'<b>chart key</b>':'<b>Cookbook §'+f.sec+'</b>')+
    '<span>'+e((CATS.find(c=>c.id===f.cat)||{}).name)+'</span>'+
    '<span>'+ (f.keys||[]).map(k=>e(k)).join(' · ') +'</span></div>'+
    '<h1>'+e(f.name)+'</h1><p class="blurb">'+f.blurb+'</p>'+
    '<div class="acts">'+
      '<button class="btn '+(isOn?'':'pri')+'" data-act="toggle" data-id="'+f.id+'">'+(isOn?'Remove from values.yaml':'Add to values.yaml')+'</button>'+
      (f.ex?'<button class="btn" data-act="example" data-id="'+f.id+'">Fill with the cookbook example</button>':'')+
      (isOn?'<button class="btn" data-act="clear" data-id="'+f.id+'">Clear fields</button>':'')+
    '</div>';
  if(f.presets)h+='<div class="chips" style="margin:-10px 0 22px">'+f.presets.map((p,i)=>
    '<button class="chip mini" data-act="fpreset" data-id="'+f.id+'" data-i="'+i+'">'+e(p.label)+'</button>').join('')+'</div>';
  h+=(f.fields||[]).map(fd=>fieldHTML(f.id,fd,v)).join('');
  let rs=[];try{rs=isOn?(f.renders(v)||[]):[];}catch(x){}
  if(rs.length)h+='<div class="sub">Renders</div><div class="chips">'+rs.map(r=>
    '<span class="chip"><b>'+e(r.kind)+'</b> '+e(r.name)+(r.scope==='cluster'?' · cluster-scoped':'')+'</span>').join('')+'</div>';
  if(f.notes&&f.notes.length)h+='<div class="sub">From the cookbook</div>'+f.notes.map(n=>'<p class="note">'+n+'</p>').join('');
  h+='</div>';
  host.innerHTML=h;
}
function presetsHTML(){
  return '<div class="plate-in"><div class="eyebrow"><b>Start here</b><span>six shapes this chart is usually asked for</span></div>'+
    '<h1>Presets</h1><p class="blurb">Each one enables a set of features and fills them with the cookbook’s own example values. Applying a preset replaces whatever is in the build now.</p>'+
    PRESETS.map(p=>'<div class="row" style="margin-bottom:12px"><div style="display:flex;gap:12px;align-items:flex-start">'+
      '<div style="flex:1"><b style="font-family:var(--f-dsp);font-size:16px">'+e(p.name)+'</b>'+
      '<p style="margin:4px 0 8px;color:var(--ink2);font-size:13px">'+e(p.blurb)+'</p>'+
      '<div class="chips">'+p.ids.map(i=>'<span class="chip">'+e((BYID[i]||{}).name||i)+'</span>').join('')+'</div></div>'+
      '<button class="btn pri" data-act="preset" data-id="'+p.id+'">Apply</button></div></div>').join('')+
    '</div>';
}
function fleetHTML(){
  const ns=state.fleet.ns,paths=overridePaths();
  let h='<div class="plate-in"><div class="eyebrow"><b>Fleet</b><span>one base, one minimal file per namespace</span></div>'+
    '<h1>Namespaces &amp; overrides</h1>'+
    '<p class="blurb">Build the shared values once in the index on the left. Here you only name what <i>differs</i> per namespace — the generated <code>values-&lt;ns&gt;.yaml</code> files carry nothing else, so a new environment is three lines, not a copied file.</p>'+
    '<div class="field"><label>Default release name</label><input class="inp" data-fleet="release" value="'+e(state.fleet.release||'')+'" placeholder="checkout-api"></div>'+
    '<div class="sub">Namespaces</div><div class="nschips">'+
    ns.map((n,i)=>'<span class="nschip"><input class="inp" style="width:110px;padding:2px 6px;border:0;background:none;font-family:var(--f-mo)" data-fleet="ns" data-i="'+i+'" data-part="name" value="'+e(n.name||'')+'">'+
      '<button class="x" data-act="nsdel" data-i="'+i+'" title="Remove">&times;</button></span>').join('')+
    '<button class="add" style="width:auto;padding:6px 14px" data-act="nsadd">+ Namespace</button>'+
    '<button class="add" style="width:auto;padding:6px 14px" data-act="nsscaffold">Scaffold dev / staging / prod</button></div>'+
    '<div class="sub">What differs</div>'+
    '<p class="blurb" style="margin-top:-4px">Blank means “inherit the base”. That is the whole point — leave everything you can blank.</p>'+
    '<div class="matrix"><table class="mx"><thead><tr><th>values path</th>'+
      ns.filter(n=>nz(n.name)).map(n=>'<th>'+e(n.name)+'</th>').join('')+'<th></th></tr></thead><tbody>'+
    (state.fleet.rows.length?state.fleet.rows.map((r,i)=>'<tr><td>'+e(r.path)+'</td>'+
      ns.filter(n=>nz(n.name)).map(n=>'<td><input class="cell" data-fleet="cell" data-i="'+i+'" data-ns="'+e(n.name)+'" placeholder="inherit" value="'+e(((r.vals||{})[n.name])||'')+'"></td>').join('')+
      '<td style="width:34px"><button class="x" data-act="mxdel" data-i="'+i+'">&times;</button></td></tr>').join('')
      :'<tr><td colspan="'+(ns.filter(n=>nz(n.name)).length+2)+'" style="padding:14px;color:var(--ink3)">No per-namespace differences yet — every namespace gets the base values as-is.</td></tr>')+
    '</tbody></table></div>'+
    '<div class="field" style="margin-top:14px"><label>Add an override row</label>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><select class="inp" id="mxpath" style="flex:1;min-width:220px">'+
      paths.map(p=>'<option value="'+e(p.path)+'">'+e(p.path)+'</option>').join('')+
      '<option value="__custom">custom path…</option></select>'+
    '<button class="btn pri" data-act="mxadd">Add row</button></div>'+
    '<div class="hint">Paths come from the features you have enabled, plus the ones that vary in almost every deployment.</div></div>'+
    '<div class="sub">Anything else, per namespace</div>'+
    ns.filter(n=>nz(n.name)).map((n,i)=>'<div class="field"><label>'+e(n.name)+' — extra YAML appended to values-'+e(n.name)+'.yaml</label>'+
      '<textarea class="inp" rows="4" data-fleet="extra" data-name="'+e(n.name)+'" placeholder="ingress:&#10;  hosts:&#10;    - host: api.'+e(n.name)+'.example.com&#10;      paths:&#10;        - path: /&#10;          pathType: Prefix&#10;          portName: http">'+e(n.extra||'')+'</textarea>'+
      '<div class="hint">Helm replaces lists wholesale, so a list-valued key has to be restated in full here rather than patched.</div></div>').join('')+
    '<p class="note"><b>Order matters.</b> <code>-f values.yaml -f values-&lt;ns&gt;.yaml</code> — the later file wins, key by key. Maps deep-merge; lists are replaced entirely.</p>'+
    '<p class="note"><b>Cluster-scoped objects are not per-namespace.</b> StorageClasses, PersistentVolumes, SCCs, ClusterRoles and ClusterSecretStores are one object for the whole cluster. Deploying them from every namespace means the releases fight; the Checks tab lists any this build would duplicate.</p>'+
    '</div>';
  return h;
}

/* ---------- output ---------- */
function hl(l){
  if(/^\s*#/.test(l))return '<span class="c-cm">'+e(l)+'</span>';
  const m=l.match(/^(\s*(?:- )?)([A-Za-z0-9_.\/-]+)(:)(.*)$/);
  if(!m)return e(l);
  return e(m[1])+'<span class="c-k">'+e(m[2])+'</span>:'+hlv(m[4]);
}
function hlv(s){
  if(!s.trim())return e(s);
  const t=s.trim();
  if(/^(true|false)$/.test(t))return ' <span class="c-b">'+e(t)+'</span>';
  if(/^-?[\d.]+$/.test(t))return ' <span class="c-n">'+e(t)+'</span>';
  return ' <span class="c-s">'+e(t)+'</span>';
}
function renderOut(){
  const files=currentFiles();
  if(state.file>=files.length)state.file=0;
  const bar=$('#filebar');
  if(files.length>1){bar.hidden=false;
    bar.innerHTML=files.map((f,i)=>'<button data-act="file" data-i="'+i+'" aria-pressed="'+(i===state.file)+'">'+e(f.name)+
      (f.sub?'<span style="opacity:.6"> · '+e(f.sub)+'</span>':'')+'</button>').join('');
  }else{bar.hidden=true;bar.innerHTML='';}
  const body=$('#outbody');
  const cks=checks(),bad=cks.filter(c=>c.l==='bad').length;
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab));
  const tb=$('#tabs button[data-tab="checks"]');
  tb.innerHTML='Checks'+(bad?'<span class="pill">'+bad+'</span>':'');
  if(state.tab==='files'){
    const f=files[state.file];const ls=f.text.split('\n');
    const own=n=>(f.marks||[]).some(m=>n>=m.from&&n<=m.to&&m.ids.indexOf(state.sel)>=0);
    body.innerHTML='<div class="code">'+ls.map((l,i)=>
      '<div class="cl'+(own(i)?' own':'')+'"><span class="n">'+(i+1)+'</span><span class="t">'+hl(l)+'</span></div>').join('')+'</div>';
    $('#stat').textContent=f.name+' · '+ls.length+' lines · '+f.text.length+' bytes';
  }else if(state.tab==='renders'){
    const rs=allRenders();const by={};rs.forEach(r=>(by[r.kind]=by[r.kind]||[]).push(r));
    body.innerHTML='<div class="pad">'+(rs.length?Object.keys(by).sort().map(k=>
      '<div class="resg"><h4>'+e(k)+' · '+by[k].length+'</h4>'+by[k].map(r=>
        '<div class="resitem"><span class="k">'+e(r.kind)+'</span><span class="nm">'+e(r.name)+'</span>'+
        (r.scope==='cluster'?'<span class="sc">cluster-scoped</span>':'')+'</div>').join('')+'</div>').join('')
      :'<p style="color:var(--ink3)">Nothing rendered yet. Add a feature from the index.</p>')+'</div>';
    $('#stat').textContent=rs.length+' object'+(rs.length===1?'':'s');
  }else{
    body.innerHTML='<div class="pad">'+cks.map(c=>'<div class="ck '+c.l+'"><span class="d">'+
      (c.l==='bad'?'blocks':c.l==='warn'?'check':'clear')+'</span><p>'+c.t+'</p></div>').join('')+'</div>';
    $('#stat').textContent=cks.length+' check'+(cks.length===1?'':'s');
  }
}
function renderAll(){renderRail();renderPlate();renderOut();}

/* ---------- input plumbing ---------- */
function readEl(el){
  if(el.type==='checkbox')return el.checked;
  return el.value;
}
function applyInput(el){
  if(el.dataset.fleet)return applyFleet(el);
  const fid=el.dataset.f;if(!fid)return;
  const st=ensure(fid),v=st.v,val=readEl(el);
  if(el.dataset.fk!==undefined){
    const fk=el.dataset.fk,i=+el.dataset.ri;
    v[fk]=Array.isArray(v[fk])?v[fk]:[];
    v[fk][i]=v[fk][i]||{};
    v[fk][i][el.dataset.k]=val;
  }else if(el.dataset.kvi!==undefined){
    const k=el.dataset.k,i=+el.dataset.kvi;
    v[k]=Array.isArray(v[k])?v[k]:[];
    v[k][i]=v[k][i]||{k:'',v:''};
    v[k][i][el.dataset.part]=val;
  }else v[el.dataset.k]=val;
  if(!st.on)st.on=true;
  save();
}
function applyFleet(el){
  const w=el.dataset.fleet;
  if(w==='release')state.fleet.release=el.value;
  else if(w==='ns'){const n=state.fleet.ns[+el.dataset.i];if(n)n.name=el.value.trim();}
  else if(w==='extra'){const n=state.fleet.ns.find(x=>x.name===el.dataset.name);if(n)n.extra=el.value;}
  else if(w==='cell'){const r=state.fleet.rows[+el.dataset.i];if(r){r.vals=r.vals||{};r.vals[el.dataset.ns]=el.value;}}
  save();
}
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='q')return renderRail();
  if(el.dataset.f||el.dataset.fleet){applyInput(el);renderRail();renderOut();}
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='q')return;
  if(el.dataset.f||el.dataset.fleet){applyInput(el);renderAll();}
});

/* ---------- clicks ---------- */
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]'),g=ev.target.closest('[data-goto]');
  if(a){
    ev.preventDefault();ev.stopPropagation();
    /* row and key-value buttons address their feature with data-f; the
       feature-level buttons use data-id. Reading only one of them left every
       Add/Remove throwing on an undefined id, which killed the handler before
       it could re-render — the button looked dead. */
    const id=a.dataset.id||a.dataset.f,k=a.dataset.k,i=+a.dataset.i;
    switch(a.dataset.act){
      case 'toggle':{const st=ensure(id);st.on=!st.on;
        if(st.on&&BYID[id].ex&&!Object.keys(clean(st.v)).length)st.v=Object.assign(defaults(id),clone(BYID[id].ex));
        state.sel=id;state.view='feature';save();break;}
      case 'example':{const st=ensure(id);st.v=Object.assign(defaults(id),clone(BYID[id].ex||{}));st.on=true;save();break;}
      case 'clear':{const st=ensure(id);st.v=defaults(id);save();break;}
      case 'fpreset':{const st=ensure(id);Object.assign(st.v,clone(BYID[id].presets[i].v));st.on=true;save();break;}
      case 'preset':{const p=PRESETS.find(x=>x.id===id);if(p)applyPreset(p);break;}
      case 'rowadd':{const st=ensure(id);st.v[k]=Array.isArray(st.v[k])?st.v[k]:[];
        const fd=(BYID[id].fields||[]).find(x=>x.k===k),row={};
        (fd.cols||[]).forEach(c=>{if(c.def!==undefined)row[c.k]=c.def;});
        st.v[k].push(row);st.on=true;save();break;}
      case 'rowdel':{const st=ensure(id);(st.v[k]||[]).splice(+a.dataset.ri,1);save();break;}
      case 'kvadd':{const st=ensure(id);st.v[k]=Array.isArray(st.v[k])?st.v[k]:[];st.v[k].push({k:'',v:''});st.on=true;save();break;}
      case 'kvdel':{const st=ensure(id);(st.v[k]||[]).splice(+a.dataset.kvi,1);save();break;}
      case 'file':{state.file=i;renderOut();return;}
      case 'nsadd':{state.fleet.ns.push({name:'ns'+(state.fleet.ns.length+1)});save();break;}
      case 'nsdel':{state.fleet.ns.splice(i,1);save();break;}
      case 'nsscaffold':{state.fleet.ns=[{name:'dev'},{name:'staging'},{name:'prod'}];
        state.fleet.rows=[
          {path:'replicaCount',vals:{dev:'1',staging:'2',prod:'4'}},
          {path:'image.tag',vals:{dev:'main',staging:'rc',prod:''}},
          {path:'resources.requests.cpu',vals:{dev:'50m',staging:'100m',prod:'500m'}},
          {path:'resources.requests.memory',vals:{dev:'64Mi',staging:'128Mi',prod:'512Mi'}}];
        save();break;}
      case 'mxadd':{const sel=$('#mxpath');let p=sel.value;
        if(p==='__custom'){p=prompt('values path, dotted (e.g. ingress.className)');if(!p)return;}
        if(!state.fleet.rows.find(r=>r.path===p))state.fleet.rows.push({path:p,vals:{}});
        save();break;}
      case 'mxdel':{state.fleet.rows.splice(i,1);save();break;}
    }
    return renderAll();
  }
  if(g){
    ev.preventDefault();
    if(g.dataset.goto==='__fleet')state.view='fleet';
    else{state.sel=g.dataset.goto;state.view='feature';}
    if(innerWidth<=820)document.body.dataset.pane='plate';
    renderAll();
    $('.plate').scrollTop=0;
  }
});

/* ---------- chrome ---------- */
$('#tabs').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tab]');
  if(!b)return;state.tab=b.dataset.tab;renderOut();});
$('#modeseg').addEventListener('click',ev=>{const b=ev.target.closest('button[data-mode]');if(!b)return;
  state.mode=b.dataset.mode;state.file=0;
  $$('#modeseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===state.mode));
  if(state.mode==='fleet')state.view='fleet';else if(state.view==='fleet')state.view='feature';
  save();renderAll();});
$('#paneseg').addEventListener('click',ev=>{const b=ev.target.closest('button[data-pane]');if(!b)return;
  document.body.dataset.pane=b.dataset.pane;
  $$('#paneseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pane===b.dataset.pane));});
$('#btn-presets').addEventListener('click',()=>{state.view='presets';renderAll();$('.plate').scrollTop=0;});
$('#btn-all').addEventListener('click',()=>{enableAll();renderAll();});
$('#btn-reset').addEventListener('click',()=>{state.f={};state.fleet.rows=[];state.view='feature';save();renderAll();});
$('#btn-copy').addEventListener('click',async()=>{
  const f=currentFiles()[state.file];const b=$('#btn-copy');
  try{await navigator.clipboard.writeText(f.text);}
  catch(x){const ta=document.createElement('textarea');ta.value=f.text;document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');}catch(y){}ta.remove();}
  b.textContent='Copied '+f.name;setTimeout(()=>{b.textContent='Copy file';},1400);});

/* ---------- go ---------- */
document.body.dataset.pane='plate';
$$('#paneseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pane==='plate'));
if(!load())applyPreset(PRESETS[0]);
$$('#modeseg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===state.mode));
if(state.mode==='fleet')state.view='fleet';
renderAll();
</script>
