apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-data-postgres
  labels:
    app: demo-data-postgres
spec:
  serviceName: demo-data-postgres
  replicas: 1
  selector:
    matchLabels:
      app: demo-data-postgres
  template:
    metadata:
      labels:
        app: demo-data-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: demo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-data-postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "demo"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-data-postgres-credentials
type: Opaque
stringData:
  password: "demo-change-me-123"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-data-postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: demo-data-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
