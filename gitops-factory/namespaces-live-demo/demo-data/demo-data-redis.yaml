apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-data-redis
  labels:
    app: demo-data-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-data-redis
  template:
    metadata:
      labels:
        app: demo-data-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-data-redis
spec:
  type: ClusterIP
  selector:
    app: demo-data-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
