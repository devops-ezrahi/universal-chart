[pytest]
# The two analysis rounds each carry a `test_zero_width.py` and a
# `test_reference_integrity.py`, in different folders and about different
# defects. Under pytest's default "prepend" import mode those basenames collide
# — the test directories are not packages, so the second file to be collected
# tries to import under a module name the first already owns:
#
#   import file mismatch:
#     regression/ERRORS_NEW_ANALYSIS/ExternalSecret_ZeroWidth_U200C_Source_Fix/test/test_zero_width.py
#     regression/ERRORS_ANALYSIS/Zero_Width_Unicode_In_SecretStoreRef/test/test_zero_width.py
#
# Collection then aborts, and the whole suite can only ever be run one round at
# a time. That is how a round could sit at 12 failures without it being obvious:
# nobody ran both halves in one command.
#
# importlib mode gives each file a module name derived from its full path, so
# same-named tests in different folders coexist. Renaming the files would work
# too and would be worse — the names are accurate, and a folder's test should be
# named after the defect, not after whatever else happens to exist in the repo.
addopts = --import-mode=importlib
testpaths = regression/ERRORS_ANALYSIS regression/ERRORS_NEW_ANALYSIS regression/HELM_CHART_SWEEP test_sanitize_fidelity_report.py test_namespaces_to_chart.py test_live_fidelity.py test_yaml_traps.py test_sibling_namespaces.py test_chart_defaults.py
