jenkins:
  systemMessage: "Welcome to Jenkins <censored: team codename>"
  numExecutors: 0
  labelString: "master"
  mode: EXCLUSIVE
  globalNodeProperties:
    - envVars:
        env:
          - key: "REGISTRY_URL"
            value: "<censored: internal artifactory domain>"
          - key: "JFROG_REGISTRY"
            value: "<censored: internal artifactory domain>"
  securityRealm:
    # local:
    #  users:
    #     - id: admin
    #       password: admin
    oic:
      allowedTokenExpirationClockSkewSeconds: 0
      clientId: "${OIC_CLIENT_ID}"
      clientSecret: "${OIC_CLIENT_SECRET}"
      disableSslVerification: false

      escapeHatchSecret: "${OIC_ESCAPE_HATCH_SECRET}"
      escapeHatchUsername: "${OIC_ESCAPE_HATCH_USERNAME}"
      escapeHatchEnabled: true
      escapeHatchGroup: 'admins'

      groupIdStrategy: "caseSensitive"
      logoutFromOpenidProvider: false
      serverConfiguration:
        wellKnown:
          scopesOverride: "openid role"
          wellKnownOpenIDConfigurationUrl: "${OIC_WELL_KNOWN}"
      userIdStrategy: "caseSensitive"
      userNameField: "sub"
      groupsFieldName: "role"

  authorizationStrategy:
    roleBased:
      roles:
        global:
        - name: "admin"
          entries:
          - group: "<censored: ldap group dn>"
          - user: "admin"
          pattern: ".*"
          permissions:
          - "Overall/Administer"
        - name: "team"
          entries:
            - group: "<censored: ldap group dn>"
            - group: "<censored: ldap group dn>"
            - group: "<censored: ldap group dn>"
            - group: "<censored: ldap group dn>"
            - group: "<censored: ldap group dn>"
            - user: "<censored: service account username>"
          pattern: ".*"
          permissions:
            - "Overall/Read"
        items:
        - name: "team-<censored: team codename>"
          entries:
          - group: "<censored: ldap group dn>"
          pattern: "(?i)<censored: team pattern>(?:$|/.*)"
          permissions: &developerPermissions
          - "Job/Build"
          - "Credentials/Delete"
          - "Credentials/ManageDomains"
          - "View/Create"
          - "Job/Read"
          - "Credentials/View"
          - "Credentials/Update"
          - "Run/Replay"
          - "Run/Delete"
          - "Job/Cancel"
          - "Run/Update"
          - "Credentials/Create"
          - "View/Delete"
          - "Job/Workspace"
          - "View/Read"
          - "View/Configure"
        - name: "team-<censored: team codename>"
          entries:
          - group: "<censored: ldap group dn>"
          - group: "<censored: ldap group dn>"
          - user: '<censored: user id>' #<censored: user name>
          pattern: "(?i)<censored: team pattern>.*|<censored: team pattern>.*|<censored: argocd pattern>(?:/(?:<censored: pattern>.*|<censored: pattern>.*))?"
          permissions: *developerPermissions
        - name: "team-<censored: team codename>"
          entries:
          - group: "<censored: ldap group dn>"
          - user: "<censored: service account username>"
          - user: '<censored: user id>' #<censored: user name>
          pattern: "(?i)<censored: team pattern>($|/.*)|<censored: argocd pattern>(/<censored: team pattern>.*)?"
          permissions: *developerPermissions
        - name: "team-<censored: team codename>"
          entries:
          - group: "<censored: ldap group dn>"
          pattern: "(?i)<censored: team pattern>($|/.*)"
          permissions: *developerPermissions
        - name: "team-<censored: team codename>"
          entries:
          - group: "<censored: ldap group dn>"
          - user: '<censored: user id>' #<censored: user name>
          pattern: "(?i)<censored: team pattern>($|/.*)|<censored: argocd pattern>(/<censored: team pattern>.*)?"
          permissions: *developerPermissions
        - name: "team-<censored: team codename>"
          entries:
          - user: "<censored: user id>" #<censored: user name>
          pattern: "<censored: argocd pattern>(/<censored: team pattern>.*)?"
          permissions: *developerPermissions
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  clouds:
    - kubernetes:
        name: "kubernetes"
        namespace: "{{ .Release.Namespace }}"
        jenkinsUrl: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:8080"
        webSocket: true
        waitForPodSec: 180
        templates: &templates
          - name: "kubeagent-jnlp"
            label: "kubeagent-jnlp"
            containers:
              - name: "jnlp"
                image: "<censored: internal image path>"
                workingDir: "/home/jenkins/agent"
                alwaysPullImage: true
                args: "-noCertificateCheck"
          - name: "ubi8"
            label: "ubi8"
            containers:
              - name: "ubi8"
                image: "<censored: internal image path>"
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "99d"
                alwaysPullImage: true
          - name: "ubi9"
            label: "ubi9"
            containers:
              - name: "ubi9"
                image: "<censored: internal image path>"
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "99d"
                alwaysPullImage: true
          - name: "yq"
            label: "yq"
            containers:
              - name: "yq"
                image: "<censored: internal image path>"
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "99d"
                alwaysPullImage: true
          - name: buildkit-rootless
            label: "buildkit-rootless"
            containers:
              - name: buildkit-rootless
                image: <censored: internal image path>
                resourceLimitEphemeralStorage: 7Gi
                alwaysPullImage: true
                args: "--oci-worker-no-process-sandbox"
                envVars:
                - envVar:
                    key: "XDG_RUNTIME_DIR"
                    value: "/home/user/.local/tmp"
                - envVar:
                    key: "TMPDIR"
                    value: "/home/user/.local/tmp"
                privileged: true
                runAsUser: 1000
            volumes:
            - emptyDirVolume:
                memory: false
                mountPath: "/home/user/.local/tmp"
            - emptyDirVolume:
                memory: false
                mountPath: "/home/user/.local/share/buildkit"
            - secretVolume:
                mountPath: "/home/user/.docker"
                optional: false
                secretName: "docker-credentials"
          - name: buildkit-rootful
            label: "buildkit-rootful"
            containers:
              - name: buildkit-rootful
                image: <censored: internal image path>
                resourceLimitEphemeralStorage: 7Gi
                alwaysPullImage: true
                privileged: true
                runAsUser: 0
                envVars:
                - envVar:
                    key: TMPDIR
                    value: "/tmp/buildkit"
            volumes:
            - emptyDirVolume:
                memory: false
                mountPath: "/tmp/buildkit"
            - emptyDirVolume:
                memory: false
                mountPath: "/run/buildkit"
            - emptyDirVolume:
                memory: false
                mountPath: "/var/lib/buildkit"
            - secretVolume:
                mountPath: "/home/user/.docker"
                optional: false
                secretName: "docker-credentials"
          - name: buildkit
