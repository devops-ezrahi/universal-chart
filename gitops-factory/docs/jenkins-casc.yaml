            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
        mode: EXCLUSIVE
        name: "dev-<censored: team codename>-win2"
        remoteFS: "C:\\software\\jenkins-{{ .Values.appset.name }}"
        retentionStrategy: "always"
    - permanent:
        labelString: "<censored: docker host> docker"
        mode: EXCLUSIVE
        name: "<censored: docker host>"
        remoteFS: "/software/jenkins"
        numExecutors: 5
        nodeProperties:
          - envVars:
              env:
                - key: "DOCKER_BUILDKIT"
                  value: "1"
        launcher:
          ssh:
            credentialsId: "docker-ssh-user"
            host: "<censored: docker host>"
            port: 22
            launchTimeoutSeconds: 60
            maxNumRetries: 3
            retryWaitTime: 120
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
