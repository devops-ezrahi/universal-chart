unclassified:
  location:
    url: "https://{{ tpl .Values.route.host $ }}/"
  hashicorpVault:
    configuration:
      disableChildPoliciesOverride: false
      engineVersion: 2
      vaultCredentialId: "Vault-Kubernetes"
      vaultUrl: "<censored: internal vault url>"
  splunkJenkinsInstallation:
    enabled: true
    globalPipelineFilter: true
    host: "<censored: splunk host>"
    maxEventsBatchSize: 262144
    metaDataConfig: |
      build_event.index=
      file.index=jenkins_artifact
    metadataHost: "<censored: jenkins metadata host url>"
    metadataItemSet:
    - dataSource: "BUILD_EVENT"
      keyName: "index"
    - dataSource: "FILE"
      keyName: "index"
      value: "jenkins_artifact"
    port: 8088
    rawEventEnabled: true
    retriesOnError: 3
    scriptContent: |-
      //send job metadata and junit reports with page size set to 50 (each event contains max 50 test cases)
      splunkins.sendTestReport(50)
      //send coverage, each event contains max 50 class metrics
      splunkins.sendCoverageReport(50)
      //send all logs from workspace to splunk, with each file size limits to 10MB
      splunkins.archive("**/*.log", null, false, "10MB")

      //end
    splunkAppUrl: "<censored: splunk app url>"
    token: "${SPLUNK_TOKEN}"
    useSSL: false
  globalLibraries:
    libraries:
      - name: "jenkins-k8s-shared-library"
        allowVersionOverride: true
        defaultVersion: "prd"
        implicit: true
        retriever:
          modernSCM:
            scm:
              git:
                credentialsId: "<censored: devops bitbucket ssh credential>"
                remote: "<censored: internal git repository url>"
                traits:
                  # - "branchDiscoveryTrait"
                  - checkoutOption:
                      extension:
                        timeout: 5
                  - cloneOption:
                      extension:
                        depth: 1
                        noTags: false
                        shallow: true
                        timeout: 5
  bitbucketEndpointConfiguration:
    endpoints:
      - bitbucketServerEndpoint:
          displayName: "<censored: bitbucket endpoint name>"
          manageHooks: '{{ ternary true false (eq .Values.appset.name "prd") }}' ## false for non-prod jenkins
          serverUrl: "<censored: internal bitbucket url>"
          callCanMerge: true
          callChanges: true
          webhookImplementation: NATIVE
          credentialsId: "<censored: devops service account credential>"
  ansibleTowerGlobalConfig:
    towerInstallation:
      - enableDebugging: true
        towerCredentialsId: "awx-tower-access-token"
        towerDisplayName: "<censored: awx display name>"
        towerTrustCert: true
        towerURL: "<censored: internal awx url>"
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "noHostKeyVerificationStrategy"
jobs:
  - script: >
      freeStyleJob('seed-job'){
        displayName('Seed Job')
