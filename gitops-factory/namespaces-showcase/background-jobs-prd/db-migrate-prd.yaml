apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        args:
        - echo running schema migration using $(cat /etc/db-migrate/api-key); sleep 2; echo done
        volumeMounts:
        - name: credentials
          mountPath: /etc/db-migrate
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      volumes:
      - name: credentials
        secret:
          secretName: db-migrate-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: db-migrate-credentials
type: Opaque
stringData:
  api-key: showcase-migration-api-key-change-me
