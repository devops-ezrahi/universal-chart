apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cache
  labels:
    app: redis-cache
spec:
  serviceName: redis-cache
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/redis
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: redis-cache-conf
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-conf
data:
  redis.conf: 'maxmemory 200mb

    maxmemory-policy allkeys-lru

    save ""

    '
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: redis-cache
  ports:
  - name: redis
    port: 6379
    targetPort: redis
