apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
      - name: traefik
        image: traefik:v3.1
        args:
        - --configFile=/etc/traefik/traefik.yml
        ports:
        - name: web
          containerPort: 8000
        - name: admin
          containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/traefik
        - name: audit-log
          mountPath: /var/log/audit
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: admin
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: config
        configMap:
          name: api-gateway-config
      - name: audit-log
        persistentVolumeClaim:
          claimName: shop-web-audit-log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  traefik.yml: "entryPoints:\n  web:\n    address: \":8000\"\napi:\n  dashboard: true\n  insecure: true\n\
    ping: {}\nproviders:\n  file:\n    directory: /etc/traefik/dynamic\n    watch: true\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-config-reader
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-config-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-gateway-config-reader
subjects:
- kind: ServiceAccount
  name: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: web
    port: 80
    targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-dashboard
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: admin
    port: 8080
    targetPort: admin
