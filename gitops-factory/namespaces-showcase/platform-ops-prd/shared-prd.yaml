apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-ops-diagnostics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-ops-config-syncer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ops-diagnostics-role
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ops-diagnostics-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-ops-diagnostics-role
subjects:
- kind: ServiceAccount
  name: platform-ops-diagnostics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ops-config-syncer-role
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ops-config-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-ops-config-syncer-role
subjects:
- kind: ServiceAccount
  name: platform-ops-config-syncer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ops-alert-thresholds
data:
  CPU_ALERT_THRESHOLD_PCT: '85'
  MEM_ALERT_THRESHOLD_PCT: '90'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ops-allow-monitoring-scrape
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: platform-ops-shared-placeholder
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: platform-ops-metrics-aggregate
spec:
  type: ClusterIP
  selector:
    app: metrics-agent
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
