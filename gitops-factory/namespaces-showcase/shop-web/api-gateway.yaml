apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 2
  # Wait 10s after each pod reports Ready before continuing the rollout. The
  # Kubernetes default is 0, so this is a deliberate rollout-safety setting and
  # not a restatement of a default — losing it means a rolling update advances
  # the instant a pod goes Ready, which on a gateway is exactly where a
  # too-fast rollout drops in-flight connections. The report's line-by-line
  # pass rated it MEDIUM and said "Should be preserved"; its bulk suppression
  # pass then swept it into a defaults bucket. The deep-dive was right.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --configFile=/etc/traefik/traefik.yml
          ports:
            - name: web
              containerPort: 8000
            - name: admin
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
            - name: audit-log
              mountPath: /var/log/audit
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
        # Owned by the namespace's 'shared' release (shared.yaml), not this
        # microservice — storefront mounts the same claim too.
        - name: audit-log
          persistentVolumeClaim:
            claimName: shop-web-audit-log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  traefik.yml: |
    entryPoints:
      web:
        address: ":8000"
    api:
      dashboard: true
      insecure: true
    ping: {}
    providers:
      file:
        directory: /etc/traefik/dynamic
        watch: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-config-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-gateway-config-reader
subjects:
  - kind: ServiceAccount
    name: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: web
      port: 80
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-dashboard
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: admin
      port: 8080
      targetPort: admin
---
# No OpenShift Route CRD on this cluster — see storefront.yaml's Ingress for
# the full explanation. Only the main entrypoint gets an Ingress; the
# chart's ingress support is a single object (no routes:-style plural map
# the way Route has), so api-gateway-dashboard above stays cluster-internal
# only rather than trying to force two hosts/paths through one Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api-gateway.devops-ezrahi.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: web
