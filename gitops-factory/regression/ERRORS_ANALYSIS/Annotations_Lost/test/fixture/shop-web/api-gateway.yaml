# Fixture for ERRORS_ANALYSIS/Annotations_Lost.
#
# Derived from namespaces-showcase/shop-web/api-gateway.yaml. Every object
# carries one annotation from the NOT-SAFE-TO-DROP list error.txt names, plus
# the server-generated ones that ARE safe, so the filter is tested from both
# sides at once:
#
#   argocd.argoproj.io/sync-wave     losing it reorders the whole deploy sequence
#   prometheus.io/scrape + port      losing them silently stops metrics collection
#   checksum/config                  losing it stops pods restarting on config change
#   traefik.ingress.kubernetes.io/*  the only NOT-SAFE keys that really occur in
#                                    this repo (6 of them, all on Ingresses)
#
#   kubectl.kubernetes.io/last-applied-configuration   server-generated, dropped
#   deployment.kubernetes.io/revision                  server-generated, dropped
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    checksum/config: 9f2c1e4a
    deployment.kubernetes.io/revision: "7"
    kubectl.kubernetes.io/last-applied-configuration: '{"apiVersion":"v1","kind":"redacted"}'
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: gateway
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-allow
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: ["Ingress"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway-reader
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-reader
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-gateway-reader
subjects:
  - kind: ServiceAccount
    name: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
---
# The Ingress above names this Service. The chart refuses to render an Ingress
# backend whose port it cannot resolve, so the pair has to travel together.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
