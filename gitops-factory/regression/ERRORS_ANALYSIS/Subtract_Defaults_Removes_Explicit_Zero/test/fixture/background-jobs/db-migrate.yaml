# Derived from namespaces-showcase/background-jobs/db-migrate.yaml — same
# namespace, same microservice file name, same Job/Secret pair. Changed:
# backoffLimit is an explicit 0 ("a failed migration must not be retried"),
# matching nightly-report.yaml's, so common_subtree() hoists the shared 0 into
# background-jobs/defaults.yaml and subtract_defaults() removes it from both
# microservices' own files. That is the exact mechanism error.txt blames.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo running schema migration using $(cat /etc/db-migrate/api-key); sleep 2; echo done"]
          volumeMounts:
            - name: credentials
              mountPath: /etc/db-migrate
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: credentials
          secret:
            secretName: db-migrate-credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: db-migrate-credentials
type: Opaque
stringData:
  api-key: "showcase-migration-api-key-change-me"
