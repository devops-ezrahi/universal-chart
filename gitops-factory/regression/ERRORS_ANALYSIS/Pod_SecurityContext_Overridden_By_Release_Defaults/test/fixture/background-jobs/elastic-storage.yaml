# Reproduces error.txt's "raw fsGroup/runAsUser 1000 rendered as 2000".
#
# The release-level workload deliberately runs as 2000 (standing in for the
# defaults.yaml value error.txt blames) while both jobs run as 1000. If the
# chart uses the release-level podSecurityContext for the jobs, they come out as
# 2000 and cannot read files their own PVC owns as 1000.
#
# Also covers the CONTAINER-level securityContext on the jobs, which jobPodSpec
# does not render at all -- a total loss rather than an override.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-storage
  labels:
    app: elastic-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elastic-storage
  template:
    metadata:
      labels:
        app: elastic-storage
    spec:
      # The release-level value. Jobs below must NOT inherit it.
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
      containers:
        - name: api
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "-c", "sleep 3600"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-storage-seed
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      # THE FIELD UNDER TEST - pod level, must survive as 1000.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seed
          image: busybox:1.36
          # THE FIELD UNDER TEST - container level, currently not rendered at all.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c", "echo seeding"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: elastic-storage-retention
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: retention
              image: busybox:1.36
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              command: ["/bin/sh", "-c", "echo pruning"]
