apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-service-yellow-b2b
  namespace: fac2
  labels:
    app: filter-service-yellow-b2b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filter-service-yellow-b2b
  template:
    metadata:
      labels:
        app: filter-service-yellow-b2b
    spec:
      containers:
        - name: filter
          image: registry.example.org/filter:1.4.2
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COLOR
              value: yellow
            - name: SELF_URL
              value: http://api.fac2.svc:8080
            - name: NEIGHBOUR_URL
              value: http://db.fac1.svc:5432
          envFrom:
            - configMapRef:
                name: filter-alerts
          volumeMounts:
            - name: certs-yellow
              mountPath: /etc/certs/yellow
        - name: proxy-yellow
          image: registry.example.org/proxy:2.0
          args: ["--color", "yellow"]
      volumes:
        - name: certs-yellow
          secret:
            secretName: certs-yellow
---
apiVersion: v1
kind: Service
metadata:
  name: filter-service-yellow-b2b
  namespace: fac2
spec:
  selector:
    app: filter-service-yellow-b2b
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: filter-service-yellow-b2b
  namespace: fac2
spec:
  host: filter.fac2.yellow.example.org
  to:
    kind: Service
    name: filter-service-yellow-b2b
  port:
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filter-alerts
  namespace: fac2
data:
  ALERT: "{{ $labels.pod }} is down in fac2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings-yellow
  namespace: fac2
data:
  mode: yellow
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-yellow
  namespace: fac2
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.example.org/report:1.0
              env:
                - name: COLOR
                  value: yellow
              envFrom:
                - configMapRef:
                    name: settings-yellow
