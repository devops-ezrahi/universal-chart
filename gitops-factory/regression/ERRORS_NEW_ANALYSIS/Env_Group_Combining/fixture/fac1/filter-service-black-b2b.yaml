apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-service-black-b2b
  namespace: fac1
  labels:
    app: filter-service-black-b2b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filter-service-black-b2b
  template:
    metadata:
      labels:
        app: filter-service-black-b2b
    spec:
      containers:
        - name: filter
          image: registry.example.org/filter:1.4.2
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: COLOR
              value: black
            - name: SELF_URL
              value: http://api.fac1.svc:8080
            - name: NEIGHBOUR_URL
              value: http://db.fac2.svc:5432
          envFrom:
            - configMapRef:
                name: filter-alerts
          volumeMounts:
            - name: certs-black
              mountPath: /etc/certs/black
        - name: proxy-black
          image: registry.example.org/proxy:2.0
          args: ["--color", "black"]
      volumes:
        - name: certs-black
          secret:
            secretName: certs-black
---
apiVersion: v1
kind: Service
metadata:
  name: filter-service-black-b2b
  namespace: fac1
spec:
  selector:
    app: filter-service-black-b2b
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: filter-service-black-b2b
  namespace: fac1
spec:
  host: filter.fac1.black.example.org
  to:
    kind: Service
    name: filter-service-black-b2b
  port:
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filter-alerts
  namespace: fac1
data:
  ALERT: "{{ $labels.pod }} is down in fac1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings-black
  namespace: fac1
data:
  mode: black
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-black
  namespace: fac1
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.example.org/report:1.0
              env:
                - name: COLOR
                  value: black
              envFrom:
                - configMapRef:
                    name: settings-black
