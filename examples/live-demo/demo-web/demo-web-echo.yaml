apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-echo
  labels:
    app: demo-web-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web-echo
  template:
    metadata:
      labels:
        app: demo-web-echo
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-echo
spec:
  type: ClusterIP
  selector:
    app: demo-web-echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: demo-web-echo
spec:
  to:
    kind: Service
    name: demo-web-echo
  port:
    targetPort: http
