# env/dev/env.yaml
# Dev-wide settings — applied to ALL apps in ALL dev clusters.
# Only contains what differs from _base/defaults.yaml

replicaCount: 1   # always 1 in dev

resources:        # smaller in dev
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Debug-friendly probe settings
livenessProbe:
  initialDelaySeconds: 30   # more time to start in dev

# No PDB in dev
pdb:
  enabled: false
