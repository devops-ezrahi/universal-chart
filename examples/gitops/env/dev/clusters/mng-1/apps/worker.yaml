# env/dev/clusters/mng-1/apps/worker.yaml

image:
  tag: "dev-latest"

env:
  QUEUE_URL: redis://redis-dev:6379
  LOG_LEVEL: debug

# StatefulSet multi-volumeClaimTemplates — one per pod, auto-provisioned
volumeClaimTemplates:
  - name: queue-data
    accessModes: [ReadWriteOnce]
    size: 2Gi              # smaller in dev
    storageClassName: fast-ssd
  - name: worker-scratch
    accessModes: [ReadWriteOnce]
    size: 1Gi

volumeMounts:
  - name: queue-data
    mountPath: /var/queue
  - name: worker-scratch
    mountPath: /tmp/scratch
