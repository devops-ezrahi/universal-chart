apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1-yellow
  namespace: prd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms1-yellow
  template:
    metadata:
      labels:
        app: ms1-yellow
    spec:
      containers:
        - name: app
          image: registry.example.org/ms1:1.0.0
          env:
            - name: ENVIRONMENT
              value: prd
            - name: DB_URL
              value: http://db.prd.svc:5432
            - name: COLOR
              value: "yellow"
            - name: LOG_LEVEL
              value: info
            - name: FEATURE_FLAG
              value: "off"
          volumeMounts:
            - name: settings-yellow
              mountPath: /etc/ms1
      volumes:
        - name: settings-yellow
          configMap:
            name: ms1-settings-yellow
---
apiVersion: v1
kind: Service
metadata:
  name: ms1-yellow
  namespace: prd
spec:
  selector:
    app: ms1-yellow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms1-settings-yellow
  namespace: prd
data:
  app.conf: |
    color = yellow
    retries = 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ms1-report-yellow
  namespace: prd
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.example.org/ms1-report:1.0.0
              args: ["--color", "yellow"]
