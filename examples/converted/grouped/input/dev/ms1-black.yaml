apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1-black
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms1-black
  template:
    metadata:
      labels:
        app: ms1-black
    spec:
      containers:
        - name: app
          image: registry.example.org/ms1:1.0.0
          env:
            - name: ENVIRONMENT
              value: dev
            - name: DB_URL
              value: http://db.dev.svc:5432
            - name: COLOR
              value: "black"
            - name: LOG_LEVEL
              value: info
            - name: FEATURE_FLAG
              value: "on"
          volumeMounts:
            - name: settings-black
              mountPath: /etc/ms1
      volumes:
        - name: settings-black
          configMap:
            name: ms1-settings-black
---
apiVersion: v1
kind: Service
metadata:
  name: ms1-black
  namespace: dev
spec:
  selector:
    app: ms1-black
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms1-settings-black
  namespace: dev
data:
  app.conf: |
    color = black
    retries = 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ms1-report-black
  namespace: dev
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.example.org/ms1-report:1.0.0
              args: ["--color", "black"]
