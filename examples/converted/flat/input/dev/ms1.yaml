apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms1
  template:
    metadata:
      labels:
        app: ms1
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          env:
            - name: ENVIRONMENT
              value: dev
            - name: DB_URL
              value: http://db.dev.svc:5432
---
apiVersion: v1
kind: Service
metadata:
  name: ms1
  namespace: dev
spec:
  selector:
    app: ms1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms1
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
    - host: ms1-dev.homelab.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ms1
                port:
                  number: 8080
