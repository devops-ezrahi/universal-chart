apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      serviceAccountName: storefront
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shared-ca-bundle
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: audit-log
              mountPath: /var/log/audit
      volumes:
        - name: site
          configMap:
            name: storefront-site
        - name: nginx-conf
          configMap:
            name: storefront-nginx-conf
        # Owned by the namespace's 'shared' release (shared.yaml), not this
        # microservice — api-gateway mounts the same claim below.
        - name: audit-log
          persistentVolumeClaim:
            claimName: shop-web-audit-log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-site
data:
  index.html: |
    <!doctype html>
    <html><body><h1>Shop Web Storefront</h1></body></html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-nginx-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        try_files $uri /index.html;
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
---
# Moved here from shared.yaml, live re-stamped first (argocd.argoproj.io/
# tracking-id changed from shop-web-shared:... to shop-web-storefront:...
# directly on the live object, kubectl annotate --overwrite, before this
# fixture change was pushed) so shop-web-storefront picks it up as an update
# to an object it already owns rather than shop-web-shared pruning it and
# shop-web-storefront creating a fresh one — this cluster's local-path
# StorageClass reclaims (deletes) the backing volume's data on PVC deletion,
# so the ordinary path would have destroyed the audit log. api-gateway.yaml
# still mounts this claim as a consumer, unchanged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-web-audit-log
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  type: ClusterIP
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
---
# This cluster (k3d-homelab, Rancher-managed k3s) has no OpenShift Route CRD
# — Traefik serves the cluster wildcard cert directly off an Ingress, same
# pattern already used for Keycloak/Jenkins/Rancher/Vault in this repo's
# helm-values/*.tmpl: no tls: block (Traefik's default TLSStore covers it),
# just the two entrypoint annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: storefront.devops-ezrahi.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: storefront
