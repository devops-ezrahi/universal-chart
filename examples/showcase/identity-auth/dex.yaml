apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app: dex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      containers:
        - name: dex
          image: dexidp/dex:v2.39.1
          args:
            - dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          volumeMounts:
            # ONE volume, THREE mounts, distinguished only by subPath — the
            # standard way to project individual ConfigMap keys onto individual
            # file paths. Every one of these carries the same `name`, which is
            # why both halves of the pipeline need a composite identity for
            # them:
            #
            #   converter — named_list_to_map keys them '<name>:<subPath>';
            #               keyed on the bare name, all but the last were
            #               silently overwritten and the container came up
            #               missing config files (previous round's
            #               VolumeMount_SubPath_Lost_Duplicate_Name_Collision).
            #   checker   — _by_name now does the same; falling back to
            #               positional made a pure REORDER read as a wholesale
            #               CHANGED of the list (this folder's defect).
            #
            # Until this manifest existed the corpus contained no subPath at
            # all, so neither fix had any standing coverage.
            # Deliberately NOT in alphabetical order. The chart renders these
            # back in sorted-key order, so a raw order that is already sorted
            # would never exercise the reordering at all — and reordering is
            # exactly what used to be reported as a wholesale CHANGED.
            - name: config
              mountPath: /etc/dex/theme.css
              subPath: theme.css
            - name: config
              mountPath: /etc/dex/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /etc/dex/connectors.yaml
              subPath: connectors.yaml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
data:
  config.yaml: |
    issuer: https://dex.showcase.example.com
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    staticClients:
      - id: showcase-client
        name: Showcase Client
        redirectURIs:
          - https://storefront.showcase.example.com/callback
        secretEnv: DEX_CLIENT_SECRET
    enablePasswordDB: true
    staticPasswords:
      - email: demo@example.com
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: demo
        userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  type: ClusterIP
  selector:
    app: dex
  ports:
    - name: http
      port: 80
      targetPort: http
---
# No OpenShift Route CRD on this cluster — see storefront.yaml for the full
# explanation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: dex.devops-ezrahi.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dex
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dex
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: dex
