# Full-featured example — exercises every chart feature
# Fixed to match the latest map-based values schema.

workload:
  type: statefulset

image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

replicaCount: 3
revisionHistoryLimit: 3
podManagementPolicy: OrderedReady

strategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

# ---------------------------------------------------------------------------
# Pod metadata
# ---------------------------------------------------------------------------
podAnnotations:
  reloader.stakater.com/auto: "true"

podLabels:
  tier: database

# ---------------------------------------------------------------------------
# Security contexts
# ---------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 999
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 999
  capabilities:
    drop: [ALL]

# ---------------------------------------------------------------------------
# Main container
# ---------------------------------------------------------------------------
ports:
  postgres:
    containerPort: 5432
    protocol: TCP

env:
  POSTGRES_DB:
    valueFrom:
      configMapKeyRef:
        name: pg-config
        key: POSTGRES_DB
  POSTGRES_USER:
    valueFrom:
      secretKeyRef:
        name: pg-secret
        key: POSTGRES_USER
  POSTGRES_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: pg-secret
        key: POSTGRES_PASSWORD
  PGDATA:
    value: /var/lib/postgresql/data/pgdata

envFrom:
  pg-config:
    type: configMapRef

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

livenessProbe:
  exec:
    command: ["/bin/sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  exec:
    command: ["/bin/sh", "-c", "pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)"]
  initialDelaySeconds: 5
  periodSeconds: 10

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "pg_ctl stop -D $PGDATA -m fast"]

terminationGracePeriodSeconds: 60

# ---------------------------------------------------------------------------
# Volume mounts
# ---------------------------------------------------------------------------
volumeMounts:
  data:
    mountPath: /var/lib/postgresql/data
  config-vol:
    mountPath: /etc/postgresql/conf.d
    readOnly: true
  tmp-dir:
    mountPath: /tmp

volumes:
  config-vol:
    configMap:
      name: pg-config
      items:
        - key: postgresql.conf
          path: custom.conf
  tmp-dir:
    emptyDir: {}

# ---------------------------------------------------------------------------
# StatefulSet volumeClaimTemplates (one PVC per pod)
# ---------------------------------------------------------------------------
volumeClaimTemplates:
  data:
    accessModes: [ReadWriteOnce]
    size: 20Gi
    storageClassName: fast-ssd
    volumeMode: Filesystem

# ---------------------------------------------------------------------------
# Init containers
# ---------------------------------------------------------------------------
initContainers:
  init-permissions:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        chown -R 999:999 /var/lib/postgresql/data
    volumeMounts:
      data:
        mountPath: /var/lib/postgresql/data

# ---------------------------------------------------------------------------
# Sidecars
# ---------------------------------------------------------------------------
sidecars:
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports:
      metrics:
        containerPort: 9187
    env:
      DATA_SOURCE_NAME:
        value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/postgres?sslmode=disable"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  ports:
    postgresql:
      port: 5432
      targetPort: postgres
    metrics:
      port: 9187
      targetPort: metrics
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false

# ---------------------------------------------------------------------------
# OpenShift Route
# ---------------------------------------------------------------------------
route:
  enabled: false

# ---------------------------------------------------------------------------
# OpenShift SCC
# ---------------------------------------------------------------------------
scc:
  db-restricted:
    allowPrivilegedContainer: false
    allowPrivilegeEscalation: false
    requiredDropCapabilities: [ALL]
    runAsUser:
      type: MustRunAsRange
    seLinuxContext:
      type: MustRunAs
    fsGroup:
      type: MustRunAs
    supplementalGroups:
      type: RunAsAny
    volumes: [configMap, downwardAPI, emptyDir, persistentVolumeClaim, projected, secret]
    users:
      - system:serviceaccount:prod:pg-serviceaccount


# ---------------------------------------------------------------------------
# ConfigMaps
# ---------------------------------------------------------------------------
configMaps:
  pg-config:
    data:
      POSTGRES_DB: myapp
      postgresql.conf: |
        max_connections = 100
        shared_buffers = 128MB

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  pg-secret:
    stringData:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "verysecretpassword"

# ---------------------------------------------------------------------------
# RBAC
# ---------------------------------------------------------------------------
rbac:
  roles:
    pg-role:
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
  roleBindings:
    pg-role-binding:
      roleRef: pg-role
      subjects:
        - kind: ServiceAccount
          name: pg-serviceaccount

# ---------------------------------------------------------------------------
# HorizontalPodAutoscaler
# ---------------------------------------------------------------------------
hpa:
  enabled: false

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# ---------------------------------------------------------------------------
pdb:
  enabled: true
  minAvailable: 2

# ---------------------------------------------------------------------------
# NetworkPolicies
# ---------------------------------------------------------------------------
networkPolicies:
  allow-pg:
    podSelector:
      matchLabels:
        tier: database
    policyTypes: [Ingress]
    ingress:
      - from:
          - podSelector:
              matchLabels:
                tier: frontend
        ports:
          - protocol: TCP
            port: 5432

# ---------------------------------------------------------------------------
# Prometheus ServiceMonitor
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  labels:
    release: prometheus
  interval: 30s
  port: metrics

# ---------------------------------------------------------------------------
# Raw YAML injection
# ---------------------------------------------------------------------------
extraDeploy:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: extra-config
    data:
      hello: world
