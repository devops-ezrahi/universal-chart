{{- include "universal-chart.renderValues" . }}
{{- with .Values.route }}
{{- if .enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .name | default (include "universal-chart.fullname" $) }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" .labels) | nindent 4 }}
  {{- /* Argo CD deletes and recreates a Route instead of patching it: OpenShift
         refuses a spec.host change without routes/custom-host, so a plain
         apply of a new host fails every sync. A recreate is a moment of 503s. */}}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" .annotations "extra" (dict "argocd.argoproj.io/sync-options" "Force=true,Replace=true")) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .host }}
  host: {{ . }}
  {{- end }}
  {{- with .path }}
  path: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ .serviceName | default (include "universal-chart.primaryServiceName" $) }}
    weight: 100
  port:
    targetPort: {{ .targetPort | default (include "universal-chart.firstKey" ($.Values.service | default dict).ports) }}
  {{- if .tls }}
  tls:
    termination: {{ .tls.termination | default "edge" }}
    {{- /* Rendered only when set: defaulting it to Redirect made every Route
           that never declared it start redirecting plain HTTP. */}}
    {{- with .tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
    {{- with .tls.certificate }}
    certificate: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- with .tls.key }}
    key: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- with .tls.caCertificate }}
    caCertificate: |
      {{- . | nindent 6 }}
    {{- end }}
    {{- with .tls.destinationCACertificate }}
    destinationCACertificate: |
      {{- . | nindent 6 }}
    {{- end }}
  {{- end }}
  wildcardPolicy: {{ .wildcardPolicy | default "None" }}
{{- end }}
{{- end }}
