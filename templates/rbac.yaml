{{- include "universal-chart.renderValues" . }}
{{/* Roles */}}
{{- range $name, $spec := .Values.rbac.roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- toYaml $spec.rules | nindent 2 }}
{{- end }}

{{/* RoleBindings */}}
{{- range $name, $spec := .Values.rbac.roleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $spec.roleRef }}
subjects:
  {{- toYaml $spec.subjects | nindent 2 }}
{{- end }}

{{/* ClusterRoles */}}
{{- range $name, $spec := .Values.rbac.clusterRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- toYaml $spec.rules | nindent 2 }}
{{- with $spec.aggregationRule }}
aggregationRule:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{/* ClusterRoleBindings */}}
{{- range $name, $spec := .Values.rbac.clusterRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $spec.roleRef }}
subjects:
  {{- toYaml $spec.subjects | nindent 2 }}
{{- end }}
