{{- include "universal-chart.renderValues" . }}
{{- range $name, $spec := .Values.jobs }}
{{- include "universal-chart.validateVolumeMounts" (dict
      "label" (printf "job %s" $name)
      "volumeMounts" $spec.volumeMounts
      "volumes" $spec.volumes
      "initContainers" $spec.initContainers
      "sidecars" $spec.sidecars) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "universal-chart.subresourceName" (dict "root" $ "name" $name) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations "consoleRef" (printf "batch~v1~Job/%s" (include "universal-chart.subresourceName" (dict "root" $ "name" $name) | trunc 63 | trimSuffix "-"))) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* hasKey, not `| default` — see the matching comment in cronjob.yaml.
         `backoffLimit: 0` means "never retry a failed Job"; `| default` treated
         it as unset and retried. The fallback is Kubernetes' own default (6),
         not the 3 this chart used to invent. */}}
  backoffLimit: {{ if hasKey ($spec | default dict) "backoffLimit" }}{{ $spec.backoffLimit }}{{ else }}6{{ end }}
  {{- with $spec.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- /* hasKey: 0 means "delete as soon as it finishes", unset means never. */}}
  {{- if and (hasKey ($spec | default dict) "ttlSecondsAfterFinished") (not (kindIs "invalid" $spec.ttlSecondsAfterFinished)) }}
  ttlSecondsAfterFinished: {{ $spec.ttlSecondsAfterFinished }}
  {{- end }}
  {{- /* See the matching comment in cronjob.yaml: hasKey, because 0 is legal
         and meaningful for both of these. */}}
  {{- if hasKey ($spec | default dict) "parallelism" }}
  parallelism: {{ $spec.parallelism }}
  {{- end }}
  {{- if hasKey ($spec | default dict) "completions" }}
  completions: {{ $spec.completions }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- if $.Values.chartLabels }}
        {{- include "universal-chart.selectorLabels" $ | nindent 8 }}
        {{- end }}
        {{- with $spec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $spec.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "universal-chart.jobPodSpec" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "job" (merge $spec (dict "name" $name))) | nindent 6 }}
{{- end }}
