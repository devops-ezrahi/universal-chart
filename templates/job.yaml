{{- range $name, $spec := .Values.jobs }}
{{- include "universal-chart.validateVolumeMounts" (dict
      "label" (printf "job %s" $name)
      "volumeMounts" $spec.volumeMounts
      "volumes" $spec.volumes
      "initContainers" $spec.initContainers
      "sidecars" $spec.sidecars) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "universal-chart.subresourceName" (dict "root" $ "name" $name) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
    {{- with $spec.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* hasKey, not `| default` — see the matching comment in cronjob.yaml.
         `backoffLimit: 0` means "never retry a failed Job"; `| default` treated
         it as unset and retried. The fallback is Kubernetes' own default (6),
         not the 3 this chart used to invent. */}}
  backoffLimit: {{ if hasKey ($spec | default dict) "backoffLimit" }}{{ $spec.backoffLimit }}{{ else }}6{{ end }}
  {{- with $spec.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with $spec.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "universal-chart.selectorLabels" $ | nindent 8 }}
    spec:
      {{- include "universal-chart.jobPodSpec" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "job" (merge $spec (dict "name" $name))) | nindent 6 }}
{{- end }}
