{{- include "universal-chart.renderValues" . }}
{{/*
Extra Services beyond the primary one (.Values.service) — MAP-BASED, keyed by
service name. Use when a microservice needs more than one Service object
(e.g. a public ClusterIP plus a headless one, or an admin-only NodePort).
*/}}
{{- range $name, $spec := .Values.services }}
{{- if $spec.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $spec.type | default "ClusterIP" }}
  {{- with $spec.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with $spec.externalName }}
  externalName: {{ . }}
  {{- end }}
  {{- with $spec.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with $spec.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* These three are rendered by service.yaml for the PRIMARY Service but
         were absent here, so every ADDITIONAL Service silently lost them:
         a second LoadBalancer dropped `externalTrafficPolicy: Local` (and with
         it client source-IP preservation), and a sticky Service dropped
         `sessionAffinity: ClientIP` (and with it the affinity itself). This
         template is a separate copy of service.yaml's spec, so anything added
         there has to be added here too or the two disagree. */}}
  {{- with $spec.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $spec.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with $spec.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey $spec "publishNotReadyAddresses" }}
  publishNotReadyAddresses: {{ $spec.publishNotReadyAddresses }}
  {{- end }}
  {{- /* See the matching comment in service.yaml: hasKey rather than `with`,
         because the default is true and it is the explicit `false` that
         matters. Extra Services need this as much as the primary — the two
         real LoadBalancers the report names are a data-receiver and an
         externally-exposed ZooKeeper, exactly the shape that lands here. */}}
  {{- if hasKey $spec "allocateLoadBalancerNodePorts" }}
  allocateLoadBalancerNodePorts: {{ $spec.allocateLoadBalancerNodePorts }}
  {{- end }}
  ports:
    {{- range $pname, $pspec := $spec.ports }}
    - name: {{ $pname }}
      port: {{ $pspec.port }}
      targetPort: {{ $pspec.targetPort | default $pspec.port }}
      protocol: {{ $pspec.protocol | default "TCP" }}
      {{- /* See the matching comment in service.yaml. This template is a second
             copy of the same port loop, so every port field has to be added in
             both places or the primary Service and the extra ones disagree. */}}
      {{- with $pspec.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
      {{- with $pspec.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  {{- if ne ($spec.type | default "ClusterIP") "ExternalName" }}
  selector:
    {{- with $spec.selector }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {{- include "universal-chart.selectorLabels" $ | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
