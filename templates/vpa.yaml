{{- include "universal-chart.renderValues" . }}
{{- if (and .Values.vpa .Values.vpa.enabled) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.vpa.labels) | nindent 4 }}
  {{- /* The object's OWN annotations merged over the release-wide ones.
         Rendering commonAnnotations alone dropped every annotation the raw
         manifest carried on this object - a lost argocd.argoproj.io/sync-wave
         reorders the whole deploy, and a lost prometheus.io/scrape stops
         metrics collection, both silently. */}}
  {{- with merge (.Values.commonAnnotations | default dict) (.Values.vpa.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: {{ index (dict "deployment" "Deployment" "statefulset" "StatefulSet" "daemonset" "DaemonSet") .Values.workload.type }}
    name: {{ include "universal-chart.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode }}
  {{- with .Values.vpa.resourcePolicy }}
  resourcePolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
