{{- include "universal-chart.renderValues" . }}
{{- range $name, $spec := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with $spec.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $spec.binaryData }}
binaryData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
