{{- include "universal-chart.renderValues" . }}
{{- if (and .Values.hpa .Values.hpa.enabled) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.hpa.labels) | nindent 4 }}
  {{- /* The object's OWN annotations merged over the release-wide ones.
         Rendering commonAnnotations alone dropped every annotation the raw
         manifest carried on this object - a lost argocd.argoproj.io/sync-wave
         reorders the whole deploy, and a lost prometheus.io/scrape stops
         metrics collection, both silently. */}}
  {{- with include "universal-chart.annotations" (dict "root" . "own" .Values.hpa.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ index (dict "deployment" "Deployment" "statefulset" "StatefulSet" "daemonset" "DaemonSet") .Values.workload.type }}
    name: {{ include "universal-chart.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  {{- with .Values.hpa.metrics }}
  metrics:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.hpa.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
