{{- include "universal-chart.renderValues" . }}
{{- if (and .Values.pdb .Values.pdb.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.pdb.labels) | nindent 4 }}
  {{- /* The object's OWN annotations merged over the release-wide ones.
         Rendering commonAnnotations alone dropped every annotation the raw
         manifest carried on this object - a lost argocd.argoproj.io/sync-wave
         reorders the whole deploy, and a lost prometheus.io/scrape stops
         metrics collection, both silently. */}}
  {{- with merge (.Values.commonAnnotations | default dict) (.Values.pdb.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "universal-chart.selectorLabels" . | nindent 6 }}
  {{- if hasKey .Values.pdb "minAvailable" }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else if hasKey .Values.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
{{- end }}
