{{- include "universal-chart.renderValues" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "universal-chart.serviceAccountName" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.serviceAccount.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" . "own" .Values.serviceAccount.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if kindIs "bool" .Values.serviceAccount.automountServiceAccountToken }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- /* Registry credentials the ServiceAccount hands to every pod that uses it.
       The converter carries only CUSTOM pull secrets: OpenShift's
       auto-generated `<sa>-dockercfg-XXXXX` entries name Secrets that its
       integrated registry controller creates, which do not exist on a vanilla
       cluster, so copying them would point the SA at objects that never
       appear. A hand-added private-registry credential is a different thing
       and must survive, or every pod using this SA fails ImagePullBackOff. */}}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- /* `secrets:` is deliberately NOT rendered. Those are token references
       Kubernetes creates and rotates for the ServiceAccount itself; declaring
       them from a chart would fight the controller that owns them. */}}
{{- end }}
