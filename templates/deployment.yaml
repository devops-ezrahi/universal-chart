{{- include "universal-chart.renderValues" . }}
{{- include "universal-chart.validate" . }}
{{- if eq .Values.workload.type "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.labels) | nindent 4 }}
  {{- /* The object's OWN annotations merged over the release-wide ones.
         Rendering commonAnnotations alone dropped every annotation the raw
         manifest carried on this object - a lost argocd.argoproj.io/sync-wave
         reorders the whole deploy, and a lost prometheus.io/scrape stops
         metrics collection, both silently. */}}
  {{- with include "universal-chart.annotations" (dict "root" . "own" .Values.annotations "consoleRef" (printf "apps~v1~Deployment/%s" (include "universal-chart.fullname" .))) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not (and .Values.hpa .Values.hpa.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- /* Omitted when unset rather than defaulted to 600: rendering a number the
         values file never declared would show up on every raw-vs-rendered diff
         as an invented field, and Kubernetes applies the same 600 anyway. */}}
  {{- with .Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  {{- /* Soak time after each pod reports Ready before the rollout continues.
         The Kubernetes default is 0, so unlike progressDeadlineSeconds there is
         no harmless default to fall back on: an explicit 10 that goes missing
         means a rolling update advances the instant a pod reports Ready, and on
         a gateway that is exactly the workload where a too-fast rollout drops
         connections. Omitted when unset for the same reason as above. */}}
  {{- with .Values.minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "universal-chart.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "universal-chart.podTemplateLabels" . | nindent 8 }}
      {{- $checksums := include "universal-chart.checksumAnnotations" . }}
      {{- if or $checksums .Values.podAnnotations }}
      annotations:
        {{- $checksums | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "universal-chart.podSpec" . | nindent 6 }}
{{- end }}
