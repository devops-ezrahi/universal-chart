{{- include "universal-chart.renderValues" . }}
{{- range $name, $spec := .Values.pvc }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- /* Argo CD must never prune or delete a PVC: losing one loses its data. */}}
  {{- with merge (dict) ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false") }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $spec.accessModes | nindent 4 }}
  {{- with $spec.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  volumeMode: {{ $spec.volumeMode | default "Filesystem" }}
  {{- with $spec.volumeName }}
  volumeName: {{ . }}
  {{- end }}
  {{- with $spec.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.dataSource }}
  dataSource:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  resources:
    requests:
      storage: {{ $spec.size }}
{{- end }}
