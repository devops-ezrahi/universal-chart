{{- include "universal-chart.renderValues" . }}
{{- if (and .Values.ingress .Values.ingress.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.ingress.labels) | nindent 4 }}
  {{- with merge (.Values.commonAnnotations | default dict) (.Values.ingress.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- /* A path may name its own backend: one Ingress routing / to a
                       UI and /api to a server is ordinary (Harbor), and a backend
                       addressed by port NUMBER has no name to give. */}}
                name: {{ .serviceName | default $.Values.ingress.serviceName | default (include "universal-chart.primaryServiceName" $) }}
                port:
                  {{- if .portNumber }}
                  number: {{ .portNumber }}
                  {{- else }}
                  name: {{ .portName | default (include "universal-chart.firstKey" $.Values.service.ports) }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
