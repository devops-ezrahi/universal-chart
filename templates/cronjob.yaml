{{- include "universal-chart.renderValues" . }}
{{- range $name, $spec := .Values.cronjobs }}
{{- /* jobTemplate is optional: a CronJob whose only required field is its
       schedule is valid, and dereferencing a nil jobTemplate here crashed the
       whole render with "nil pointer evaluating interface {}.volumeMounts" —
       so the smallest correct CronJob was the one that could not be written. */}}
{{- $jt := $spec.jobTemplate | default dict }}
{{- include "universal-chart.validateVolumeMounts" (dict
      "label" (printf "cronjob %s" $name)
      "volumeMounts" $jt.volumeMounts
      "volumes" $jt.volumes
      "initContainers" $jt.initContainers
      "sidecars" $jt.sidecars) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "universal-chart.cronJobName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $spec.schedule | quote }}
  concurrencyPolicy: {{ $spec.concurrencyPolicy | default "Forbid" }}
  {{- /* hasKey, not `| default`: Go template's `default` treats 0 as empty, so
         an explicitly declared `successfulJobsHistoryLimit: 0` ("keep no
         completed pods") silently rendered as 3 and leaked pods. Same for
         failedJobsHistoryLimit and both backoffLimits below. The fallbacks are
         Kubernetes' own defaults, so an unset field renders what the API server
         would have filled in rather than a number this chart invented. */}}
  successfulJobsHistoryLimit: {{ if hasKey $spec "successfulJobsHistoryLimit" }}{{ $spec.successfulJobsHistoryLimit }}{{ else }}3{{ end }}
  failedJobsHistoryLimit: {{ if hasKey $spec "failedJobsHistoryLimit" }}{{ $spec.failedJobsHistoryLimit }}{{ else }}1{{ end }}
  {{- if hasKey $spec "suspend" }}
  suspend: {{ $spec.suspend }}
  {{- end }}
  {{- with $spec.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      backoffLimit: {{ if hasKey $jt "backoffLimit" }}{{ $jt.backoffLimit }}{{ else }}6{{ end }}
      {{- with $jt.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with $jt.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      {{- /* hasKey rather than `with`: `parallelism: 0` is a legal way to
             suspend a Job and `with` would skip it, which is the same trap
             `backoffLimit: 0` is guarded against a few lines up. */}}
      {{- if hasKey $jt "parallelism" }}
      parallelism: {{ $jt.parallelism }}
      {{- end }}
      {{- if hasKey $jt "completions" }}
      completions: {{ $jt.completions }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- if $.Values.chartLabels }}
            {{- include "universal-chart.selectorLabels" $ | nindent 12 }}
            {{- end }}
            {{- with $jt.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $jt.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- include "universal-chart.jobPodSpec" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "job" (merge $jt (dict "name" $name))) | nindent 10 }}
{{- end }}
