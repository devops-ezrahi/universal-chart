{{- range $name, $spec := .Values.cronjobs }}
{{- include "universal-chart.validateVolumeMounts" (dict
      "label" (printf "cronjob %s" $name)
      "volumeMounts" $spec.jobTemplate.volumeMounts
      "volumes" $spec.jobTemplate.volumes
      "initContainers" $spec.jobTemplate.initContainers
      "sidecars" $spec.jobTemplate.sidecars) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "universal-chart.cronJobName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $spec.schedule | quote }}
  concurrencyPolicy: {{ $spec.concurrencyPolicy | default "Forbid" }}
  {{- /* hasKey, not `| default`: Go template's `default` treats 0 as empty, so
         an explicitly declared `successfulJobsHistoryLimit: 0` ("keep no
         completed pods") silently rendered as 3 and leaked pods. Same for
         failedJobsHistoryLimit and both backoffLimits below. The fallbacks are
         Kubernetes' own defaults, so an unset field renders what the API server
         would have filled in rather than a number this chart invented. */}}
  successfulJobsHistoryLimit: {{ if hasKey $spec "successfulJobsHistoryLimit" }}{{ $spec.successfulJobsHistoryLimit }}{{ else }}3{{ end }}
  failedJobsHistoryLimit: {{ if hasKey $spec "failedJobsHistoryLimit" }}{{ $spec.failedJobsHistoryLimit }}{{ else }}1{{ end }}
  {{- if hasKey $spec "suspend" }}
  suspend: {{ $spec.suspend }}
  {{- end }}
  {{- with $spec.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      {{- $jt := $spec.jobTemplate | default dict }}
      backoffLimit: {{ if hasKey $jt "backoffLimit" }}{{ $jt.backoffLimit }}{{ else }}6{{ end }}
      {{- with $spec.jobTemplate.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with $spec.jobTemplate.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "universal-chart.selectorLabels" $ | nindent 12 }}
        spec:
          {{- include "universal-chart.jobPodSpec" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "job" (merge $spec.jobTemplate (dict "name" $name))) | nindent 10 }}
{{- end }}
