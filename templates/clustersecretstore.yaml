{{/*
External Secrets Operator ClusterSecretStore(s) — MAP-BASED, keyed by name.
Cluster-scoped: readable by ExternalSecrets in ANY namespace. In most orgs a
platform team owns exactly one of these per backend/cluster rather than
each app release declaring its own — only put entries here if THIS release
is meant to own that cluster-wide definition (e.g. a namespace-shared or
platform release, same idea as storageClasses/scc in this chart). If you're
converting existing manifests with a tool that dedupes cluster-scoped kinds
across releases (see gitops-factory/convert_to_universal_chart.py), route
ClusterSecretStore through that same dedup path rather than declaring it
per microservice.
*/}}
{{- range $name, $spec := .Values.clusterSecretStores }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: ClusterSecretStore
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $spec.provider }}
  provider:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.retrySettings }}
  retrySettings:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  {{- with $spec.conditions }}
  conditions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
