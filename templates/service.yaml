{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal-chart.primaryServiceName" . }}
  labels:
    {{- include "universal-chart.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge (.Values.commonAnnotations | default dict) (.Values.service.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- with .Values.service.externalName }}
  externalName: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey .Values.service "publishNotReadyAddresses" }}
  publishNotReadyAddresses: {{ .Values.service.publishNotReadyAddresses }}
  {{- end }}
  {{- with .Values.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    {{- range $name, $spec := .Values.service.ports }}
    - name: {{ $name }}
      port: {{ $spec.port }}
      {{- /* Mirrors Kubernetes' own Service default: an unset targetPort
      falls back to the port NUMBER, not this map's port name — the port
      name here has no guaranteed relationship to any container port name. */}}
      targetPort: {{ $spec.targetPort | default $spec.port }}
      protocol: {{ $spec.protocol | default "TCP" }}
      {{- /* L7 hint for a service mesh; `protocol` above is only L4. Omitted
             when unset rather than defaulted — there is no sensible guess, and
             inventing one would mislabel the port. */}}
      {{- with $spec.appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
      {{- with $spec.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  {{- if ne .Values.service.type "ExternalName" }}
  selector:
    {{- include "universal-chart.selectorLabels" . | nindent 4 }}
  {{- end }}
{{- end }}
