{{- range $name, $spec := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
    {{- with $spec.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ $spec.type | default "Opaque" }}
{{- with $spec.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $spec.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
