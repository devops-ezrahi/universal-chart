{{- include "universal-chart.renderValues" . }}
{{- range $name, $spec := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ $spec.type | default "Opaque" }}
{{- with $spec.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $spec.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
