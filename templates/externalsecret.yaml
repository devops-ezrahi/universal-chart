{{/*
External Secrets Operator ExternalSecret(s) — MAP-BASED, keyed by name.
Each entry syncs keys from a SecretStore/ClusterSecretStore into a REAL
Kubernetes Secret (named after the map key, override via target.name) that
the rest of this chart consumes exactly like any other Secret — reference
it from env/envFrom/volumes the same way you would .Values.secrets.
Requires the External Secrets Operator CRDs (https://external-secrets.io).

Usage:
  externalSecrets:
    db-credentials:
      secretStoreRef:
        name: vault-backend       # a SecretStore or ClusterSecretStore name
        kind: SecretStore          # or ClusterSecretStore — default SecretStore
      refreshInterval: 1h          # default 1h
      target:
        name: db-credentials       # default: the map key
        creationPolicy: Owner      # default Owner
      data:
        - secretKey: password
          remoteRef:
            key: secret/data/myapp/db
            property: password
      # -- or pull an entire remote secret instead of listing keys one by one:
      # dataFrom:
      #   - extract:
      #       key: secret/data/myapp/db
*/}}
{{- range $name, $spec := .Values.externalSecrets }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  {{- /* The object's OWN labels, merged UNDER the chart's identity labels so a
         values file can add but never hijack them — the same rule
         universal-chart.labels applies to commonLabels. Merged into one map
         rather than emitted as a second `labels:` block, which would be a
         duplicate YAML key. Losing these is not cosmetic: ArgoCD tracks an
         object by argocd.argoproj.io/instance, so an ExternalSecret without it
         stays on the cluster unmanaged. */}}
  labels:
    {{- $core := fromYaml (include "universal-chart.labels" $) }}
    {{- toYaml (merge $core ($spec.labels | default dict)) | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* What Kubernetes garbage-collects by. Dropped, the object outlives
         whatever created it. */}}
  {{- with $spec.ownerReferences }}
  ownerReferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretStoreRef:
    name: {{ $spec.secretStoreRef.name }}
    kind: {{ $spec.secretStoreRef.kind | default "SecretStore" }}
  refreshInterval: {{ $spec.refreshInterval | default "1h" }}
  target:
    name: {{ ($spec.target).name | default $name }}
    creationPolicy: {{ ($spec.target).creationPolicy | default "Owner" }}
    {{- with ($spec.target).deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- with ($spec.target).template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $spec.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* Everything else the raw ExternalSecret declared. The converter no
         longer whitelists spec keys, so this renders whatever it carried —
         `managementPolicy`, `deliverySpec`, and any field the External Secrets
         Operator adds later. Without it a converter-only fix would leave the
         value sitting in values.yaml and still render a manifest without it.
         The omitted names are the ones rendered explicitly above plus the
         metadata this template places in metadata. */}}
  {{- with omit $spec "secretStoreRef" "refreshInterval" "target" "data" "dataFrom" "labels" "ownerReferences" "annotations" }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
