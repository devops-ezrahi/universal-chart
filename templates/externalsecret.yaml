{{/*
External Secrets Operator ExternalSecret(s) — MAP-BASED, keyed by name.
Each entry syncs keys from a SecretStore/ClusterSecretStore into a REAL
Kubernetes Secret (named after the map key, override via target.name) that
the rest of this chart consumes exactly like any other Secret — reference
it from env/envFrom/volumes the same way you would .Values.secrets.
Requires the External Secrets Operator CRDs (https://external-secrets.io).

Usage:
  externalSecrets:
    db-credentials:
      secretStoreRef:
        name: vault-backend       # a SecretStore or ClusterSecretStore name
        kind: SecretStore          # or ClusterSecretStore — default SecretStore
      refreshInterval: 1h          # default 1h
      target:
        name: db-credentials       # default: the map key
        creationPolicy: Owner      # default Owner
      data:
        - secretKey: password
          remoteRef:
            key: secret/data/myapp/db
            property: password
      # -- or pull an entire remote secret instead of listing keys one by one:
      # dataFrom:
      #   - extract:
      #       key: secret/data/myapp/db
*/}}
{{- range $name, $spec := .Values.externalSecrets }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "universal-chart.labels" $ | nindent 4 }}
  {{- with merge ($.Values.commonAnnotations | default dict) ($spec.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretStoreRef:
    name: {{ $spec.secretStoreRef.name }}
    kind: {{ $spec.secretStoreRef.kind | default "SecretStore" }}
  refreshInterval: {{ $spec.refreshInterval | default "1h" }}
  target:
    name: {{ ($spec.target).name | default $name }}
    creationPolicy: {{ ($spec.target).creationPolicy | default "Owner" }}
    {{- with ($spec.target).deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- with ($spec.target).template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $spec.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
