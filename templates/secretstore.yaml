{{- include "universal-chart.renderValues" . }}
{{/*
External Secrets Operator SecretStore(s) — MAP-BASED, keyed by name.
Defines where ExternalSecrets in THIS namespace pull from (Vault, AWS
Secrets Manager, Azure Key Vault, GCP Secret Manager, etc.). Requires the
External Secrets Operator CRDs installed on the cluster
(https://external-secrets.io) — this chart only renders the custom
resource, it does not install the operator itself.
*/}}
{{- range $name, $spec := .Values.secretStores }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: SecretStore
metadata:
  name: {{ $name }}
  {{- /* See the matching comment in externalsecret.yaml. */}}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" $ "own" $spec.labels) | nindent 4 }}
  {{- with include "universal-chart.annotations" (dict "root" $ "own" $spec.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.ownerReferences }}
  ownerReferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $spec.provider }}
  provider:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.retrySettings }}
  retrySettings:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.refreshInterval }}
  refreshInterval: {{ . }}
  {{- end }}
  {{- with $spec.conditions }}
  conditions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* Any other spec key the raw SecretStore declared — see the matching
         comment in externalsecret.yaml. */}}
  {{- with omit $spec "provider" "retrySettings" "refreshInterval" "conditions" "labels" "ownerReferences" "annotations" }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
