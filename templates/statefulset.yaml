{{- include "universal-chart.renderValues" . }}
{{- include "universal-chart.validate" . }}
{{- if eq .Values.workload.type "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "universal-chart.fullname" . }}
  labels:
    {{- include "universal-chart.objectLabels" (dict "root" . "own" .Values.labels) | nindent 4 }}
  {{- /* The object's OWN annotations merged over the release-wide ones.
         Rendering commonAnnotations alone dropped every annotation the raw
         manifest carried on this object - a lost argocd.argoproj.io/sync-wave
         reorders the whole deploy, and a lost prometheus.io/scrape stops
         metrics collection, both silently. */}}
  {{- with merge (.Values.commonAnnotations | default dict) (.Values.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Values.serviceName | default (include "universal-chart.fullname" .) }}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  {{- with .Values.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "universal-chart.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "universal-chart.podTemplateLabels" . | nindent 8 }}
      {{- $checksums := include "universal-chart.checksumAnnotations" . }}
      {{- if or $checksums .Values.podAnnotations }}
      annotations:
        {{- $checksums | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "universal-chart.podSpec" . | nindent 6 }}
  {{- with .Values.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- range $name, $spec := . }}
    - metadata:
        name: {{ $name }}
        {{- with $spec.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $spec.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml $spec.accessModes | nindent 10 }}
        {{- with $spec.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        volumeMode: {{ $spec.volumeMode | default "Filesystem" }}
        resources:
          requests:
            storage: {{ $spec.size }}
    {{- end }}
  {{- end }}
{{- end }}
