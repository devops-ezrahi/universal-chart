suite: NetworkPolicy
templates:
  - templates/networkpolicy.yaml
tests:
  - it: should not render when no policies defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a network policy
    set:
      networkPolicies:
        allow-ingress:
          policyTypes: [Ingress]
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      app: frontend
              ports:
                - protocol: TCP
                  port: 8080
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-ingress

  - it: should set policy types
    set:
      networkPolicies:
        test:
          policyTypes: [Ingress, Egress]
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should render multiple policies
    set:
      networkPolicies:
        pol1:
          policyTypes: [Ingress]
        pol2:
          policyTypes: [Egress]
    asserts:
      - hasDocuments:
          count: 2
