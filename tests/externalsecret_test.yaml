suite: External Secrets Operator - ExternalSecret
templates:
  - templates/externalsecret.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ExternalSecret per entry, named after the map key
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
                property: password
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - equal:
          path: metadata.name
          value: db-credentials

  - it: should default secretStoreRef.kind to SecretStore
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore

  - it: should support targeting a ClusterSecretStore
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-cluster-backend
            kind: ClusterSecretStore
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
    asserts:
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  - it: should default target.name to the map key and creationPolicy to Owner
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
    asserts:
      - equal:
          path: spec.target.name
          value: db-credentials
      - equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: should allow overriding target.name and creationPolicy
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          target:
            name: custom-secret-name
            creationPolicy: Merge
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
    asserts:
      - equal:
          path: spec.target.name
          value: custom-secret-name
      - equal:
          path: spec.target.creationPolicy
          value: Merge

  - it: should default refreshInterval to 1h
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: should support dataFrom instead of data
    set:
      externalSecrets:
        all-app-secrets:
          secretStoreRef:
            name: vault-backend
          dataFrom:
            - extract:
                key: secret/data/myapp/all
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/myapp/all
      - isNull:
          path: spec.data

  - it: should render multiple entries as separate documents
    set:
      externalSecrets:
        db-credentials:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: password
              remoteRef:
                key: secret/data/myapp/db
        api-key:
          secretStoreRef:
            name: vault-backend
          data:
            - secretKey: apiKey
              remoteRef:
                key: secret/data/myapp/api
    asserts:
      - hasDocuments:
          count: 2
