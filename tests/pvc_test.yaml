suite: PVC
templates:
  - templates/pvc.yaml
tests:
  - it: should not render when no PVCs defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a PVC
    set:
      pvc:
        my-data:
          accessModes: [ReadWriteOnce]
          size: 10Gi
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: my-data
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: should set storageClassName
    set:
      pvc:
        test:
          accessModes: [ReadWriteOnce]
          size: 5Gi
          storageClassName: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd

  - it: should set volumeMode
    set:
      pvc:
        test:
          accessModes: [ReadWriteOnce]
          size: 5Gi
          volumeMode: Block
    asserts:
      - equal:
          path: spec.volumeMode
          value: Block

  - it: should default volumeMode to Filesystem
    set:
      pvc:
        test:
          accessModes: [ReadWriteOnce]
          size: 5Gi
    asserts:
      - equal:
          path: spec.volumeMode
          value: Filesystem

  - it: should render multiple PVCs
    set:
      pvc:
        data:
          accessModes: [ReadWriteOnce]
          size: 10Gi
        logs:
          accessModes: [ReadWriteMany]
          size: 5Gi
    asserts:
      - hasDocuments:
          count: 2

  - it: should set dataSource
    set:
      pvc:
        test:
          accessModes: [ReadWriteOnce]
          size: 10Gi
          dataSource:
            name: my-snapshot
            kind: VolumeSnapshot
            apiGroup: snapshot.storage.k8s.io
    asserts:
      - equal:
          path: spec.dataSource.kind
          value: VolumeSnapshot
