suite: ConfigMap
templates:
  - templates/configmap.yaml
tests:
  - it: should not render when no configMaps defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a single configmap
    set:
      configMaps:
        app-config:
          data:
            LOG_LEVEL: info
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: app-config
      - equal:
          path: data.LOG_LEVEL
          value: info

  - it: should render multiple configmaps
    set:
      configMaps:
        config-1:
          data:
            key1: val1
        config-2:
          data:
            key2: val2
    asserts:
      - hasDocuments:
          count: 2

  - it: should set labels
    set:
      configMaps:
        test:
          labels:
            custom: label
          data:
            k: v
    asserts:
      - equal:
          path: metadata.labels.custom
          value: label

  - it: should set annotations
    set:
      configMaps:
        test:
          annotations:
            note: test
          data:
            k: v
    asserts:
      - equal:
          path: metadata.annotations.note
          value: test

  - it: should set binaryData
    set:
      configMaps:
        test:
          binaryData:
            logo.png: aGVsbG8=
    asserts:
      - equal:
          path: binaryData["logo.png"]
          value: aGVsbG8=

  # Top-level data/binaryData: the shape of a values repo's
  # <ns>/configMaps/<name>.yaml, deployed with fullnameOverride=<name>.
  - it: renders top-level data as one ConfigMap named after the release
    release:
      name: app-conf-cm-dev
    set:
      fullnameOverride: app-conf
      data:
        LOG_LEVEL: info
        greeting.txt: "שלום עולם\nשורה שנייה\n"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: app-conf
      - equal:
          path: data.LOG_LEVEL
          value: info
      - equal:
          path: data["greeting.txt"]
          value: "שלום עולם\nשורה שנייה\n"
      - notExists:
          path: binaryData

  - it: falls back to the release name and carries commonLabels/commonAnnotations
    release:
      name: env1
    set:
      commonLabels:
        team: shop
      commonAnnotations:
        owner: ops
      binaryData:
        logo.png: aGVsbG8=
    asserts:
      - equal:
          path: metadata.name
          value: env1
      - equal:
          path: metadata.labels.team
          value: shop
      - equal:
          path: metadata.annotations.owner
          value: ops
      - equal:
          path: binaryData["logo.png"]
          value: aGVsbG8=
      - notExists:
          path: data

  - it: renders top-level data alongside the configMaps map
    release:
      name: rel
    set:
      data:
        A: "1"
      configMaps:
        other:
          data:
            B: "2"
    asserts:
      - hasDocuments:
          count: 2

  - it: quotes numbers and booleans in data, which Kubernetes requires as strings
    set:
      configMaps:
        app:
          data:
            PORT: 8080
            BIG: 1000000
            RATIO: 1.5
            DEBUG: true
            GONE: null
            S: "007"
    asserts:
      - equal:
          path: data
          value:
            PORT: "8080"
            BIG: "1000000"
            RATIO: "1.5"
            DEBUG: "true"
            S: "007"

  - it: quotes numbers in top-level data too
    release:
      name: env1
    set:
      data:
        PORT: 8080
    asserts:
      - equal:
          path: data.PORT
          value: "8080"
