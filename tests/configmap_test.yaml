suite: ConfigMap
templates:
  - templates/configmap.yaml
tests:
  - it: should not render when no configMaps defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a single configmap
    set:
      configMaps:
        app-config:
          data:
            LOG_LEVEL: info
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: app-config
      - equal:
          path: data.LOG_LEVEL
          value: info

  - it: should render multiple configmaps
    set:
      configMaps:
        config-1:
          data:
            key1: val1
        config-2:
          data:
            key2: val2
    asserts:
      - hasDocuments:
          count: 2

  - it: should set labels
    set:
      configMaps:
        test:
          labels:
            custom: label
          data:
            k: v
    asserts:
      - equal:
          path: metadata.labels.custom
          value: label

  - it: should set annotations
    set:
      configMaps:
        test:
          annotations:
            note: test
          data:
            k: v
    asserts:
      - equal:
          path: metadata.annotations.note
          value: test

  - it: should set binaryData
    set:
      configMaps:
        test:
          binaryData:
            logo.png: aGVsbG8=
    asserts:
      - equal:
          path: binaryData["logo.png"]
          value: aGVsbG8=
