suite: Extra Services (map-based)
templates:
  - templates/services.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render an entry that is not enabled
    set:
      services:
        admin:
          ports:
            admin-http:
              port: 8081
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one Service per enabled entry, named after the map key
    set:
      services:
        admin:
          enabled: true
          ports:
            admin-http:
              port: 8081
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: admin

  - it: should render multiple entries as separate documents
    set:
      services:
        admin:
          enabled: true
          ports:
            admin-http:
              port: 8081
        headless:
          enabled: true
          clusterIP: None
          ports:
            db:
              port: 5432
    asserts:
      - hasDocuments:
          count: 2

  - it: should default type to ClusterIP
    set:
      services:
        admin:
          enabled: true
          ports:
            admin-http:
              port: 8081
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should set a custom type
    set:
      services:
        admin:
          enabled: true
          type: NodePort
          ports:
            admin-http:
              port: 8081
              targetPort: 8081
              nodePort: 30081
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30081

  - it: should default targetPort to the port number when not set, matching Kubernetes' own Service default
    set:
      services:
        admin:
          enabled: true
          ports:
            admin-http:
              port: 8081
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8081

  - it: should support headless services via clusterIP None
    set:
      services:
        headless:
          enabled: true
          clusterIP: None
          ports:
            db:
              port: 5432
    asserts:
      - equal:
          path: spec.clusterIP
          value: None

  - it: should fall back to the chart's own selector labels when no custom selector is set
    set:
      services:
        admin:
          enabled: true
          ports:
            admin-http:
              port: 8081
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should use a custom selector when provided
    set:
      services:
        admin:
          enabled: true
          selector:
            app: other-app
          ports:
            admin-http:
              port: 8081
    asserts:
      - equal:
          path: spec.selector.app
          value: other-app
