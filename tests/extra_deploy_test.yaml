suite: ExtraDeploy
templates:
  - templates/extra-deploy.yaml
tests:
  - it: should not render when no extraDeploy defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render raw YAML
    set:
      extraDeploy:
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: extra-cm
          data:
            key: value
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: extra-cm

  - it: should render multiple extra deploys
    set:
      extraDeploy:
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm1
          data:
            k: v
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cm2
          data:
            k: v
    asserts:
      - hasDocuments:
          count: 2
