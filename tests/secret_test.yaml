suite: Secret
templates:
  - templates/secret.yaml
tests:
  - it: should not render when no secrets defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a secret
    set:
      secrets:
        app-secret:
          stringData:
            DB_PASSWORD: secret123
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: app-secret
      - equal:
          path: stringData.DB_PASSWORD
          value: secret123

  - it: should default type to Opaque
    set:
      secrets:
        test:
          stringData:
            k: v
    asserts:
      - equal:
          path: type
          value: Opaque

  - it: should set custom type
    set:
      secrets:
        tls-secret:
          type: kubernetes.io/tls
          data:
            tls.crt: dGVzdA==
            tls.key: dGVzdA==
    asserts:
      - equal:
          path: type
          value: kubernetes.io/tls

  - it: should render multiple secrets
    set:
      secrets:
        secret-1:
          stringData:
            k: v
        secret-2:
          stringData:
            k: v
    asserts:
      - hasDocuments:
          count: 2
