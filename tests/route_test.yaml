suite: OpenShift Route
templates:
  - templates/route.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      route:
        enabled: true
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - isKind:
          of: Route
      - equal:
          path: apiVersion
          value: route.openshift.io/v1

  - it: should set host
    set:
      route:
        enabled: true
        host: myapp.apps.cluster.example.com
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: spec.host
          value: myapp.apps.cluster.example.com

  - it: should set path
    set:
      route:
        enabled: true
        path: /api
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: spec.path
          value: /api

  - it: should set TLS termination
    set:
      route:
        enabled: true
        tls:
          termination: passthrough
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: spec.tls.termination
          value: passthrough

  - it: should default targetPort to first service port name
    set:
      route:
        enabled: true
      service:
        ports:
          web:
            port: 80
            targetPort: 8080
    asserts:
      - equal:
          path: spec.port.targetPort
          value: web

  - it: should set custom targetPort
    set:
      route:
        enabled: true
        targetPort: grpc
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: spec.port.targetPort
          value: grpc

  - it: should set wildcard policy
    set:
      route:
        enabled: true
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: spec.wildcardPolicy
          value: None

  - it: should let Argo CD force-replace the Route
    set:
      route:
        enabled: true
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Force=true,Replace=true

  - it: should keep a sync-options annotation set in values
    set:
      route:
        enabled: true
        annotations:
          argocd.argoproj.io/sync-options: Replace=true
      service:
        ports:
          http:
            port: 80
            targetPort: http
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Replace=true

  - it: defaults to edge TLS with HTTP redirected (OpenShift convention)
    set:
      route:
        enabled: true
        targetPort: http
    asserts:
      - equal:
          path: spec.tls.termination
          value: edge
      - equal:
          path: spec.tls.insecureEdgeTerminationPolicy
          value: Redirect

  - it: omits insecureEdgeTerminationPolicy when set to ""
    set:
      route:
        enabled: true
        targetPort: http
        tls:
          insecureEdgeTerminationPolicy: ""
    asserts:
      - equal:
          path: spec.tls.termination
          value: edge
      - notExists:
          path: spec.tls.insecureEdgeTerminationPolicy

  - it: renders no TLS with tls null
    set:
      route:
        enabled: true
        targetPort: http
        tls: null
    asserts:
      - notExists:
          path: spec.tls

  - it: connects to the primary Service and its first port by default
    set:
      fullnameOverride: web
      ports:
        http:
          containerPort: 8080
      route:
        enabled: true
    asserts:
      - equal:
          path: spec.to.name
          value: web
      - equal:
          path: spec.port.targetPort
          value: http

  - it: follows a renamed primary Service
    set:
      fullnameOverride: web
      service:
        name: web-svc
        ports:
          api:
            port: 80
            targetPort: 8080
      route:
        enabled: true
    asserts:
      - equal:
          path: spec.to.name
          value: web-svc
      - equal:
          path: spec.port.targetPort
          value: api

  - it: renders insecureEdgeTerminationPolicy when set
    set:
      route:
        enabled: true
        targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
    asserts:
      - equal:
          path: spec.tls.insecureEdgeTerminationPolicy
          value: Redirect
