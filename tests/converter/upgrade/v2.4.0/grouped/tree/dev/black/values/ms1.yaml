image:
  repository: registry.example.org/ms1
  tag: 9.9.9
replicaCount: 1
env:
- name: ENVIRONMENT
  value: dev
- name: DB_URL
  value: http://db.dev.svc:5432
- name: COLOR
  value: black
- name: LOG_LEVEL
  value: trace
- name: FEATURE_FLAG
  value: 'on'
cronjobs:
  ms1-report-{{ .Values.color }}:
    jobTemplate:
      image:
        repository: registry.example.org/ms1-report
        tag: 1.0.0
