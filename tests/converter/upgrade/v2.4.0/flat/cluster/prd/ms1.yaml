apiVersion: v1
kind: Service
metadata:
  name: ms1
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:/Service:prd/ms1
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ms1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:apps/Deployment:prd/ms1
  namespace: prd
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms1
  template:
    metadata:
      labels:
        app: ms1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:1.27-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: ENVIRONMENT
          value: prd
        - name: DB_URL
          value: http://db.prd.svc:5432
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms1
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:networking.k8s.io/Ingress:prd/ms1
  namespace: prd
spec:
  ingressClassName: traefik
  rules:
  - host: ms1-prd.homelab.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ms1
            port:
              number: 8080
