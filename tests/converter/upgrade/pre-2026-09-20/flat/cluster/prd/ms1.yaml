apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms1
  labels:
    app.kubernetes.io/instance: ms1-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:/ServiceAccount:prd/ms1
  namespace: prd
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: ms1
  labels:
    app.kubernetes.io/instance: ms1-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:/Service:prd/ms1
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/name: ms1
    app.kubernetes.io/instance: ms1-prd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1
  labels:
    app.kubernetes.io/instance: ms1-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:apps/Deployment:prd/ms1
  namespace: prd
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ms1
      app.kubernetes.io/instance: ms1-prd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms1
        app.kubernetes.io/instance: ms1-prd
    spec:
      serviceAccountName: ms1
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:1.27-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_URL
          value: http://db.prd.svc:5432
        - name: ENVIRONMENT
          value: prd
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms1
  labels:
    app.kubernetes.io/instance: ms1-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd:networking.k8s.io/Ingress:prd/ms1
  namespace: prd
spec:
  ingressClassName: traefik
  rules:
  - host: ms1-prd.homelab.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ms1
            port:
              name: http
