apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms1-black
  labels:
    app.kubernetes.io/instance: ms1-black-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-black-prd:/ServiceAccount:prd/ms1-black
  namespace: prd
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ms1-settings-black
  labels:
    app.kubernetes.io/instance: ms1-black-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-black-prd:/ConfigMap:prd/ms1-settings-black
  namespace: prd
data:
  app.conf: 'color = black

    retries = 3

    '
---
apiVersion: v1
kind: Service
metadata:
  name: ms1-black
  labels:
    app.kubernetes.io/instance: ms1-black-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-black-prd:/Service:prd/ms1-black
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/instance: ms1-black-prd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1-black
  labels:
    app.kubernetes.io/instance: ms1-black-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-black-prd:apps/Deployment:prd/ms1-black
  namespace: prd
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ms1-black
      app.kubernetes.io/instance: ms1-black-prd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms1-black
        app.kubernetes.io/instance: ms1-black-prd
    spec:
      serviceAccountName: ms1-black
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: registry.example.org/ms1:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: COLOR
          value: black
        - name: DB_URL
          value: http://db.prd.svc:5432
        - name: ENVIRONMENT
          value: prd
        - name: FEATURE_FLAG
          value: 'off'
        - name: LOG_LEVEL
          value: info
        volumeMounts:
        - name: settings-black
          mountPath: /etc/ms1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      volumes:
      - name: settings-black
        configMap:
          name: ms1-settings-black
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ms1-report-black
  labels:
    app.kubernetes.io/instance: ms1-black-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms1-black
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms1-black-prd:batch/CronJob:prd/ms1-report-black
  namespace: prd
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ms1-black
            app.kubernetes.io/instance: ms1-black-prd
        spec:
          restartPolicy: OnFailure
          serviceAccountName: ms1-black
          containers:
          - name: report
            image: registry.example.org/ms1-report:1.0.0
            imagePullPolicy: IfNotPresent
            args:
            - --color
            - black
