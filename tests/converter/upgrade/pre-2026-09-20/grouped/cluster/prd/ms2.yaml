apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms2
  labels:
    app.kubernetes.io/instance: ms2-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms2
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms2-prd:/ServiceAccount:prd/ms2
  namespace: prd
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: ms2
  labels:
    app.kubernetes.io/instance: ms2-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms2
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms2-prd:/Service:prd/ms2
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/name: ms2
    app.kubernetes.io/instance: ms2-prd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms2
  labels:
    app.kubernetes.io/instance: ms2-prd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ms2
    app.kubernetes.io/version: 2.0.0
    helm.sh/chart: super-universal-chart-1.0.0
  annotations:
    argocd.argoproj.io/tracking-id: ms2-prd:apps/Deployment:prd/ms2
  namespace: prd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ms2
      app.kubernetes.io/instance: ms2-prd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms2
        app.kubernetes.io/instance: ms2-prd
    spec:
      serviceAccountName: ms2
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: registry.example.org/ms2:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: COLOR
          value: none
        - name: DB_URL
          value: http://db.prd.svc:5432
        - name: ENVIRONMENT
          value: prd
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
