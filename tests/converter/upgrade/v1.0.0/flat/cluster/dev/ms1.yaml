apiVersion: v1
kind: Service
metadata:
  name: ms1
  annotations:
    argocd.argoproj.io/tracking-id: ms1-dev:/Service:dev/ms1
  namespace: dev
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ms1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1-dev
  annotations:
    argocd.argoproj.io/tracking-id: ms1-dev:apps/Deployment:dev/ms1-dev
  namespace: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms1
  template:
    metadata:
      labels:
        app: ms1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: nginxinc/nginx-unprivileged:9.9.9
        imagePullPolicy: IfNotPresent
        env:
        - name: ENVIRONMENT
          value: dev
        - name: DB_URL
          value: http://db.dev.svc:5432
        - name: LOG_LEVEL
          value: trace
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms1-dev
  annotations:
    argocd.argoproj.io/tracking-id: ms1-dev:networking.k8s.io/Ingress:dev/ms1-dev
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
  - host: ms1-dev.homelab.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ms1
            port:
              number: 8080
