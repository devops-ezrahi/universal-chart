apiVersion: v1
kind: Service
metadata:
  name: ms2
  annotations:
    argocd.argoproj.io/tracking-id: ms2-prd:/Service:prd/ms2
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ms2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms2-prd
  annotations:
    argocd.argoproj.io/tracking-id: ms2-prd:apps/Deployment:prd/ms2-prd
  namespace: prd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms2
  template:
    metadata:
      labels:
        app: ms2
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: registry.example.org/ms2:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: ENVIRONMENT
          value: prd
        - name: DB_URL
          value: http://db.prd.svc:5432
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
