apiVersion: v1
kind: ConfigMap
metadata:
  name: ms1-settings-black
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd-black:/ConfigMap:prd/ms1-settings-black
  namespace: prd
data:
  app.conf: 'color = black

    retries = 3

    '
---
apiVersion: v1
kind: Service
metadata:
  name: ms1-black
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd-black:/Service:prd/ms1-black
  namespace: prd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ms1-black
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms1-black
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd-black:apps/Deployment:prd/ms1-black
  namespace: prd
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ms1-black
  template:
    metadata:
      labels:
        app: ms1-black
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: registry.example.org/ms1:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: COLOR
          value: black
        - name: DB_URL
          value: http://db.prd.svc:5432
        - name: ENVIRONMENT
          value: prd
        - name: FEATURE_FLAG
          value: 'off'
        - name: LOG_LEVEL
          value: info
        volumeMounts:
        - name: settings-black
          mountPath: /etc/ms1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      volumes:
      - name: settings-black
        configMap:
          name: ms1-settings-black
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ms1-report-black
  annotations:
    argocd.argoproj.io/tracking-id: ms1-prd-black:batch/CronJob:prd/ms1-report-black
  namespace: prd
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels: null
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: registry.example.org/ms1-report:1.0.0
            imagePullPolicy: IfNotPresent
            args:
            - --color
            - black
