image:
  repository: registry.example.org/ms1
  tag: 1.0.0
replicaCount: 3
env:
- name: ENVIRONMENT
  value: prd
- name: DB_URL
  value: http://db.prd.svc:5432
- name: COLOR
  value: black
- name: LOG_LEVEL
  value: info
- name: FEATURE_FLAG
  value: 'off'
cronjobs:
  ms1-report-{{ .Values.color }}:
    jobTemplate:
      image:
        repository: registry.example.org/ms1-report
        tag: 1.0.0
