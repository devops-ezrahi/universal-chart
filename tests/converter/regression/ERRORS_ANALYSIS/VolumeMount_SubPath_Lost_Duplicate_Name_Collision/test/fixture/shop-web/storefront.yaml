# Derived from namespaces-showcase/shop-web/storefront.yaml. The one change
# that reproduces the defect: the `nginx-conf` ConfigMap volume is mounted
# THREE times with different subPaths, projecting individual keys to individual
# file paths. That is the standard way to place single files without shadowing
# the rest of a directory, and it is exactly the shape error.txt reports for
# amdi-client / data-sender (same volume name, different subPath, different
# mountPath).
#
# Under the unfixed converter, named_list_to_map keys volumeMounts by mount
# NAME, so the last of the three wins and the first two vanish: nginx starts
# with no nginx.conf and no mime.types.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # Three mounts, ONE volume name. All three must survive.
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-conf
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # A plain, unique mount: must keep its simple key and be unaffected.
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: storefront-nginx-conf
        - name: site
          configMap:
            name: storefront-site
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-nginx-conf
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
  mime.types: |
    types { text/html html; }
  default.conf: |
    server { listen 8080; root /usr/share/nginx/html; }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-site
data:
  index.html: |
    <!doctype html><html><body><h1>Shop Web Storefront</h1></body></html>
