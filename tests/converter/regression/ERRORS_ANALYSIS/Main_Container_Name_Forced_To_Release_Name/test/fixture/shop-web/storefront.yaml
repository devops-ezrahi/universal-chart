# VERBATIM slice of namespaces-showcase/shop-web/storefront.yaml (trimmed to the
# workload). Nothing was added: this defect IS exercised by the real showcase
# data, unlike folders 1-4.
#
# Raw container name: 'nginx'. Release: 'storefront'.
# Unfixed, the chart renders the container as 'storefront'.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
