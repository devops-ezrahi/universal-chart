suite: HPA
templates:
  - templates/hpa.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 10
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: apiVersion
          value: autoscaling/v2

  - it: should set min and max replicas
    set:
      hpa:
        enabled: true
        minReplicas: 3
        maxReplicas: 20
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 20

  - it: should set metrics
    set:
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
    asserts:
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu

  - it: should set behavior
    set:
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300

  - it: should target deployment by default
    set:
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment

  - it: should target statefulset when configured
    set:
      workload.type: statefulset
      hpa:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
    asserts:
      - equal:
          path: spec.scaleTargetRef.kind
          value: Statefulset
