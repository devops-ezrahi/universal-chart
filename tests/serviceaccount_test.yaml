suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when create is true
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount

  - it: should not render when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set custom name
    set:
      serviceAccount:
        create: true
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should default name to fullname
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: should set annotations
    set:
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::role/my-role

  - it: should set automountServiceAccountToken
    set:
      serviceAccount:
        create: true
        automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
