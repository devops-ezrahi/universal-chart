suite: External Secrets Operator - ClusterSecretStore
templates:
  - templates/clustersecretstore.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ClusterSecretStore per entry, named after the map key
    set:
      clusterSecretStores:
        vault-cluster-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
    asserts:
      - isKind:
          of: ClusterSecretStore
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - equal:
          path: metadata.name
          value: vault-cluster-backend

  - it: should render multiple entries as separate documents
    set:
      clusterSecretStores:
        vault-cluster-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
        aws-cluster-backend:
          provider:
            aws:
              service: SecretsManager
              region: us-east-1
    asserts:
      - hasDocuments:
          count: 2
