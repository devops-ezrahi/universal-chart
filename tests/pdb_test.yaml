suite: PodDisruptionBudget
templates:
  - templates/pdb.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled with minAvailable
    set:
      pdb:
        enabled: true
        minAvailable: 1
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should render with maxUnavailable
    set:
      pdb:
        enabled: true
        maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: should support percentage
    set:
      pdb:
        enabled: true
        minAvailable: "50%"
    asserts:
      - equal:
          path: spec.minAvailable
          value: "50%"

  - it: should set selector labels
    set:
      pdb:
        enabled: true
        minAvailable: 1
    asserts:
      - isNotNull:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
