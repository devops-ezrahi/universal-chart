suite: External Secrets Operator - SecretStore
templates:
  - templates/secretstore.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretStore per entry, named after the map key
    set:
      secretStores:
        vault-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
              path: secret
              version: v2
    asserts:
      - isKind:
          of: SecretStore
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - equal:
          path: metadata.name
          value: vault-backend
      - equal:
          path: spec.provider.vault.server
          value: https://vault.example.com:8200

  - it: should render multiple entries as separate documents
    set:
      secretStores:
        vault-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
        aws-backend:
          provider:
            aws:
              service: SecretsManager
              region: us-east-1
    asserts:
      - hasDocuments:
          count: 2

  - it: should respect a custom externalSecretsApiVersion
    set:
      externalSecretsApiVersion: external-secrets.io/v1
      secretStores:
        vault-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1

  - it: should pass through refreshInterval and retrySettings
    set:
      secretStores:
        vault-backend:
          provider:
            vault:
              server: https://vault.example.com:8200
          refreshInterval: 30s
          retrySettings:
            maxRetries: 5
            retryInterval: 10s
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 30s
      - equal:
          path: spec.retrySettings.maxRetries
          value: 5
