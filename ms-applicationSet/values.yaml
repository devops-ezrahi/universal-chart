# The three required values are supplied per-namespace by the values repo's
# rootApplicationSet.yaml (helm parameters), not set here.
namespace: ""          # REQUIRED - the namespace directory in the values repo == the k8s namespace
originRepoURL: ""      # REQUIRED - the values (gitops) repo holding base/ and <namespace>/
originBranch: ""       # REQUIRED - revision of that repo

# Subpath inside originRepoURL where the values tree actually lives, for when it
# is folded into a larger repo instead of being that repo's root. Empty (the
# default) means the repo root IS the values tree.
originPath: ""

# The namespace's folder under originPath. Empty = the namespace itself. A
# variant folder ("prd/yellow", "prd/yellow/eu") deploys into `namespace` and
# appends what follows the namespace to every generated name ("ms1-prd-yellow-eu").
folder: ""
# Glob under <namespace>/values/. The default also finds files in sub-folders
# with ArgoCD's legacy git-file globbing; use "**/*.yaml" with the new one.
# base/ mirrors those sub-folders: values/group1/ms1.yaml reads base/group1/ms1.yaml.
valuesGlob: "*.yaml"

# Whether each generated Application syncs itself (syncPolicy.automated, with
# prune and selfHeal). false leaves every microservice's Application OutOfSync
# until someone presses Sync in Argo CD. The default keeps the existing
# behaviour; convert_to_universal_chart.py's rootApplicationSet passes false
# unless run with --auto-sync true.
autoSync: true

# The ApplicationSet controller puts resources-finalizer.argocd.argoproj.io on
# every Application it generates and puts it back whenever it is removed by
# hand. With that finalizer, deleting an Application (or this ApplicationSet)
# deletes every workload it deployed. true stops the controller adding it:
# deleting the Application or the ApplicationSet leaves the workloads running.
# On by default: removing an Argo CD Application (or a whole namespace folder)
# must never take the running workloads with it. Set false to have deletes
# cascade to the workloads again.
preserveResourcesOnDeletion: true

# What the ApplicationSet controller may do to the Applications it generates
# (spec.syncPolicy.applicationsSync). Empty = Argo CD's default ("sync": create,
# update and delete). "create-only" / "create-delete" stop it updating existing
# Applications, so a hand edit to one (a removed finalizer included) stays.
# "create-update" never deletes an Application whose values file was removed.
# Needs the controller's policy override enabled
# (applicationsetcontroller.enable.policy.override).
applicationsSync: ""

# Links between Argo CD, the values repo and the OpenShift console. Set them
# once, as helm parameters on the root ApplicationSet (the converter's
# --argocd-url / --console-url). Every object every microservice deploys is
# annotated with its Application (and its values file, when the repo's web UI
# is known) - metadata only, no pod restarts, but the first time under manual
# sync each Application reads OutOfSync until it is synced.
links:
  # Set in rootApplicationSet.yaml, in full, never here: one values repo can
  # span several clusters and Argo CDs.
  # false = no link on the workloads the microservices deploy (the Application
  # keeps its own values-file links). Nothing else is ever written on them.
  objects: true
  # Argo CD's web UI, e.g. https://openshift-gitops-server-openshift-gitops.apps.example.com
  # Each workload gets the OpenShift topology view's corner link to its
  # Application.
  argocdUrl: ""
  # The namespace the generated Applications live in. Empty = the namespace this
  # chart is rendered into, which is where Argo CD creates them.
  argocdNamespace: ""
  # The OpenShift web console, e.g. https://console-openshift-console.apps.example.com
  # Each workload becomes a link from its node in Argo CD's resource tree to its
  # page in the console. Set in full; empty = no console link.
  consoleUrl: ""
  # The values repo's web UI, for links to the exact files an Application
  # layers. Empty = derived from originRepoURL on Bitbucket Server, GitHub or
  # GitLab: https (/scm/<project>/<repo>.git) or SSH (ssh://git@host:7999/
  # <project>/<repo>.git, git@host:<project>/<repo>.git), the web UI taken to
  # be https on the same host. Set it when the UI is elsewhere. Each
  # Application then links to its own values file (Argo CD's external-link)
  # and carries all three files as universal-chart/{base,defaults,values}-file.
  repoWebUrl: ""
  # An OpenShift ConsoleLink on this namespace's Project overview, to the Argo
  # CD Applications deploying into it. Cluster-scoped: the root Application's
  # project must allow console.openshift.io/ConsoleLink. Needs argocdUrl.
  consoleLink: false

project: default
destinationServer: https://kubernetes.default.svc
destinationName: ""   # a registered cluster name; wins over destinationServer when set

# The Universal Chart itself - what each generated Application renders.
chartRepoURL: https://github.com/devops-ezrahi/universal-chart.git
chartRevision: main
chartPath: "."
