suite: ApplicationSet
templates:
  - templates/applicationSet.yaml
set:
  namespace: rakia-fac1
  folder: rakia-fac1/black
  originRepoURL: https://example.com/values.git
  originBranch: main
tests:
  - it: names a variant folder's ApplicationSet after namespace and variant
    asserts:
      - equal:
          path: metadata.name
          value: rakia-fac1-black

  - it: preserves workloads on delete by default
    asserts:
      - equal:
          path: spec.syncPolicy
          value:
            preserveResourcesOnDeletion: true

  - it: accepts the string an Argo CD helm parameter passes
    set:
      preserveResourcesOnDeletion: "True"
    asserts:
      - equal:
          path: spec.syncPolicy.preserveResourcesOnDeletion
          value: true

  - it: leaves syncPolicy out entirely when nothing is set, never null
    set:
      preserveResourcesOnDeletion: false
      applicationsSync: ""
    asserts:
      - notExists:
          path: spec.syncPolicy

  - it: leaves syncPolicy out for a blank applicationsSync
    set:
      preserveResourcesOnDeletion: "false"
      applicationsSync: " "
    asserts:
      - notExists:
          path: spec.syncPolicy

  - it: writes applicationsSync alone
    set:
      preserveResourcesOnDeletion: false
      applicationsSync: create-only
    asserts:
      - equal:
          path: spec.syncPolicy
          value:
            applicationsSync: create-only

  - it: reads each folder's defaults.yaml alongside its values files
    asserts:
      - equal:
          path: spec.generators[0].matrix.generators[0].git.files[0].path
          value: rakia-fac1/black/values/*.yaml
      - equal:
          path: spec.generators[0].matrix.generators[1].git.files[0].path
          value: rakia-fac1/black/defaults.yaml
      - equal:
          path: spec.generators[0].matrix.generators[1].git.pathParamPrefix
          value: defaults
      - notExists:
          path: spec.template.spec.syncPolicy

  - it: digs autoSync from defaults.yaml, falling back to the chart's autoSync (true)
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: '\{\{- if ne \(dig "autoSync" "true" \. \| toString \| lower\) "false" \}\}\n\s+automated:'
      - matchRegex:
          path: spec.templatePatch
          pattern: 'CreateNamespace=true'

  - it: falls back to manual sync when autoSync is false
    set:
      autoSync: "false"
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: 'dig "autoSync" "false" \.'

  - it: treats autoSync "False" from Argo CD's UI as false
    set:
      autoSync: "False"
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: 'dig "autoSync" "false" \.'

  - it: derives the values-file link from an https Bitbucket Server URL
    set:
      originRepoURL: https://git.example.com/scm/OPS/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from Bitbucket Server's ssh:// URL, port dropped and key upper-cased
    set:
      originRepoURL: ssh://git@git.example.com:7999/ops/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from an scp-style Bitbucket URL
    set:
      originRepoURL: git@git.example.com:ops/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from a personal Bitbucket repo over SSH
    set:
      originRepoURL: ssh://git@git.example.com:7999/~jdoe/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/users/jdoe/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from a GitHub SSH URL
    set:
      originRepoURL: git@github.com:acme/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://github.com/acme/values/blob/main/{{ .path.path }}/{{ .path.filename }}'

  - it: derives the values-file link from a GitLab SSH URL with subgroups
    set:
      originRepoURL: ssh://git@gitlab.com/acme/platform/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://gitlab.com/acme/platform/values/-/blob/main/{{ .path.path }}/{{ .path.filename }}'

  - it: links nothing for an SSH path that is not <project>/<repo>
    set:
      originRepoURL: ssh://git@git.example.com:7999/a/b/c.git
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]

  - it: lets links.repoWebUrl win over an SSH URL
    set:
      originRepoURL: ssh://git@git.example.com:7999/ops/values.git
      links:
        repoWebUrl: https://bitbucket.example.com/bitbucket/projects/OPS/repos/values
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://bitbucket.example.com/bitbucket/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: passes consoleUrl through as set
    set:
      destinationServer: https://api.other.example.com:6443
      links:
        consoleUrl: https://console.example.com/
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: links.console
            value: https://console.example.com
            forceString: true

  - it: makes no console link when consoleUrl is not set, whatever the destination
    set:
      destinationServer: https://api.mycluster.example.com:6443
    asserts:
      - notExists:
          path: spec.template.spec.sources[0].helm.parameters

  - it: passes the chart no links when no URL is set
    asserts:
      - notExists:
          path: spec.template.spec.sources[0].helm.parameters

  - it: hands the chart the Argo CD and console links when both are set
    set:
      links:
        argocdUrl: https://argo.example.com/
        argocdNamespace: openshift-gitops
        consoleUrl: https://console.example.com
    asserts:
      - equal:
          path: spec.template.spec.sources[0].helm.parameters
          value:
            - name: links.argocd
              value: https://argo.example.com/applications/openshift-gitops/{{ if eq .path.filename "configMaps.yaml" }}configmaps{{ else }}{{ .path.filename | trimSuffix ".yaml" }}{{ end }}-fac1-black
              forceString: true
            - name: links.console
              value: https://console.example.com
              forceString: true

  - it: reads the base a values file names in BaseFile, else the base of its own name
    asserts:
      - equal:
          path: spec.template.spec.sources[0].helm.valueFiles
          value:
            - '$Values/base{{ .path.path | trimPrefix "rakia-fac1/black/values" }}/{{ if hasKey . "BaseFile" }}{{ .BaseFile | toString | trimSuffix ".yaml" }}.yaml{{ else }}{{ .path.filename }}{{ end }}'
            - '$Values/rakia-fac1/black/defaults.yaml'
            - '$Values/{{ .path.path }}/{{ .path.filename }}'

  # --- Settings that live in rootApplicationSet.yaml, with built-in fallbacks ---

  - it: falls back to the old destination and chart when the root file sets none
    asserts:
      - equal:
          path: spec.template.spec.destination.server
          value: https://kubernetes.default.svc
      - equal:
          path: spec.template.spec.sources[0].repoURL
          value: https://github.com/devops-ezrahi/universal-chart.git
      - equal:
          path: spec.template.spec.sources[0].targetRevision
          value: main
      - equal:
          path: spec.template.spec.sources[0].path
          value: "."

  - it: uses the destination and chart the root file passes
    set:
      destinationServer: https://api.other.example.com:6443
      chartRepoURL: https://git.example.com/scm/OPS/universal-chart.git
      chartRevision: v4.2.0
    asserts:
      - equal:
          path: spec.template.spec.destination.server
          value: https://api.other.example.com:6443
      - equal:
          path: spec.template.spec.sources[0].repoURL
          value: https://git.example.com/scm/OPS/universal-chart.git
      - equal:
          path: spec.template.spec.sources[0].targetRevision
          value: v4.2.0

  - it: keeps autoSync true when the root file leaves it out
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: 'dig "autoSync" "true" \.'

  - it: accepts a boolean false for preserveResourcesOnDeletion
    set:
      preserveResourcesOnDeletion: false
    asserts:
      - notExists:
          path: spec.syncPolicy

  # --- ConfigMaps folder ---

  - it: names the ConfigMaps Application after its file, lower-cased
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: '{{ if eq .path.filename "configMaps.yaml" }}configmaps{{ else }}{{ .path.filename | trimSuffix ".yaml" }}{{ end }}-fac1-black'

  - it: layers the listed configMaps/ files, then the list file, without base or defaults
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: '\{\{- if eq \.path\.filename "configMaps\.yaml" \}\}\n\s+sources:'
      - matchRegex:
          path: spec.templatePatch
          pattern: '\{\{- range \(index \. "configMapFiles"\) \}\}\n\s+- .\$Values/rakia-fac1/black/configMaps/\{\{ \. \| toString \| trimSuffix "\.yaml" \}\}\.yaml.\n\s+\{\{- end \}\}\n\s+- .\$Values/\{\{ \.path\.path \}\}/\{\{ \.path\.filename \}\}.'
      - notMatchRegex:
          path: spec.templatePatch
          pattern: 'defaults\.yaml|\$Values/base'
      - matchRegex:
          path: spec.templatePatch
          pattern: 'name: workload\.type\n\s+value: none'
      - matchRegex:
          path: spec.templatePatch
          pattern: 'fail "rakia-fac1/black/values/configMaps\.yaml must list'

  - it: reads the ConfigMaps folder under originPath
    set:
      originPath: teams/a
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: '\$Values/teams/a/rakia-fac1/black/configMaps/'

  - it: takes the ConfigMaps file, folder and list key from the root file
    set:
      configMaps:
        file: shared.yaml
        dir: cms
        listKey: files
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: '{{ if eq .path.filename "shared.yaml" }}shared{{ else }}{{ .path.filename | trimSuffix ".yaml" }}{{ end }}-fac1-black'
      - matchRegex:
          path: spec.templatePatch
          pattern: 'range \(index \. "files"\).*\n.*\$Values/rakia-fac1/black/cms/'

  - it: links the ConfigMaps Application to its own name in Argo CD
    set:
      links:
        argocdUrl: https://argo.example.com
        argocdNamespace: gitops
    asserts:
      - matchRegex:
          path: spec.templatePatch
          pattern: 'value: "https://argo\.example\.com/applications/gitops/configmaps-fac1-black"'

  - it: leaves every Application as before with configMaps.enabled "false"
    set:
      configMaps:
        enabled: "false"
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: '{{ .path.filename | trimSuffix ".yaml" }}-fac1-black'
      - notMatchRegex:
          path: spec.templatePatch
          pattern: 'configMaps|sources:'
