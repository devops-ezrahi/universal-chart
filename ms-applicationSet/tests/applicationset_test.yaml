suite: ApplicationSet
templates:
  - templates/applicationSet.yaml
set:
  namespace: rakia-fac1
  folder: rakia-fac1/black
  originRepoURL: https://example.com/values.git
  originBranch: main
tests:
  - it: names a variant folder's ApplicationSet after namespace and variant
    asserts:
      - equal:
          path: metadata.name
          value: rakia-fac1-black

  - it: preserves workloads on delete by default
    asserts:
      - equal:
          path: spec.syncPolicy
          value:
            preserveResourcesOnDeletion: true

  - it: accepts the string an Argo CD helm parameter passes
    set:
      preserveResourcesOnDeletion: "True"
    asserts:
      - equal:
          path: spec.syncPolicy.preserveResourcesOnDeletion
          value: true

  - it: leaves syncPolicy out entirely when nothing is set, never null
    set:
      preserveResourcesOnDeletion: false
      applicationsSync: ""
    asserts:
      - notExists:
          path: spec.syncPolicy

  - it: leaves syncPolicy out for a blank applicationsSync
    set:
      preserveResourcesOnDeletion: "false"
      applicationsSync: " "
    asserts:
      - notExists:
          path: spec.syncPolicy

  - it: writes applicationsSync alone
    set:
      preserveResourcesOnDeletion: false
      applicationsSync: create-only
    asserts:
      - equal:
          path: spec.syncPolicy
          value:
            applicationsSync: create-only

  - it: leaves each Application to sync by hand when autoSync is false
    set:
      autoSync: "false"
    asserts:
      - notExists:
          path: spec.template.spec.syncPolicy.automated
      - contains:
          path: spec.template.spec.syncPolicy.syncOptions
          content: CreateNamespace=true

  - it: treats autoSync "False" from Argo CD's UI as false
    set:
      autoSync: "False"
    asserts:
      - notExists:
          path: spec.template.spec.syncPolicy.automated

  - it: derives the values-file link from an https Bitbucket Server URL
    set:
      originRepoURL: https://git.example.com/scm/OPS/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from Bitbucket Server's ssh:// URL, port dropped and key upper-cased
    set:
      originRepoURL: ssh://git@git.example.com:7999/ops/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from an scp-style Bitbucket URL
    set:
      originRepoURL: git@git.example.com:ops/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from a personal Bitbucket repo over SSH
    set:
      originRepoURL: ssh://git@git.example.com:7999/~jdoe/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://git.example.com/users/jdoe/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: derives the values-file link from a GitHub SSH URL
    set:
      originRepoURL: git@github.com:acme/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://github.com/acme/values/blob/main/{{ .path.path }}/{{ .path.filename }}'

  - it: derives the values-file link from a GitLab SSH URL with subgroups
    set:
      originRepoURL: ssh://git@gitlab.com/acme/platform/values.git
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://gitlab.com/acme/platform/values/-/blob/main/{{ .path.path }}/{{ .path.filename }}'

  - it: links nothing for an SSH path that is not <project>/<repo>
    set:
      originRepoURL: ssh://git@git.example.com:7999/a/b/c.git
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]

  - it: lets links.repoWebUrl win over an SSH URL
    set:
      originRepoURL: ssh://git@git.example.com:7999/ops/values.git
      links:
        repoWebUrl: https://bitbucket.example.com/bitbucket/projects/OPS/repos/values
    asserts:
      - equal:
          path: spec.template.metadata.annotations["link.argocd.argoproj.io/external-link"]
          value: 'https://bitbucket.example.com/bitbucket/projects/OPS/repos/values/browse/{{ .path.path }}/{{ .path.filename }}?at=main'

  - it: passes consoleUrl through as set
    set:
      destinationServer: https://api.other.example.com:6443
      links:
        consoleUrl: https://console.example.com/
    asserts:
      - contains:
          path: spec.template.spec.sources[0].helm.parameters
          content:
            name: links.console
            value: https://console.example.com
            forceString: true

  - it: makes no console link when consoleUrl is not set, whatever the destination
    set:
      destinationServer: https://api.mycluster.example.com:6443
    asserts:
      - notContains:
          path: spec.template.spec.sources[0].helm.parameters
          any: true
          content:
            name: links.console
