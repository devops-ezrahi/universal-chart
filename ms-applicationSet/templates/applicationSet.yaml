{{- $ns := required "namespace is required" .Values.namespace -}}
{{- $repo := required "originRepoURL is required" .Values.originRepoURL -}}
{{- $branch := required "originBranch is required" .Values.originBranch -}}
{{- $prefix := "" -}}
{{- if .Values.originPath }}{{- $prefix = printf "%s/" .Values.originPath -}}{{- end -}}
{{- $folder := .Values.folder | default $ns -}}
{{- $suffix := ternary "" (printf "-%s" (trimPrefix (printf "%s/" $ns) $folder | replace "/" "-")) (eq $folder $ns) -}}
{{/*
  One ApplicationSet for ONE namespace. Its git "files" generator enumerates
  <namespace>/values/*.yaml in the values repo - that flat directory IS the list
  of releases, so adding a microservice is adding a file, nothing else.

  Every generated Application layers the SAME three value files, lowest -> highest:
    base/<file>                    app      - comprehensive, environment-agnostic, SHARED across namespaces
    <folder>/defaults.yaml         folder   - identical across every microservice here, plus the
                                              group values it stands for (color: yellow, environment: dev)
    <folder>/values/<file>         instance - image tag + literal env + this folder's tweaks
  The filename is the same in base/ and values/, which is what keeps the chain
  self-consistent for a given release.

  values/ may hold sub-folders purely for grouping (values/group1/ms1.yaml): a
  release is still named after its file, reads base/<file> and is layered from
  where it actually sits. File names must therefore stay unique per namespace.
  Legacy git-file globbing lets '*' cross '/', so the default glob finds them;
  with --enable-new-git-file-globbing set valuesGlob (see values.yaml).

  Variant folders (<namespace>/<variant>/..., e.g. prd/yellow and prd/black, both
  deploying into namespace prd and sharing the one base/): namespace=prd,
  folder=prd/yellow. The folder below the namespace is appended to every
  generated name (ApplicationSet prd-yellow, Application ms1-prd-yellow;
  prd/yellow/eu -> ms1-prd-yellow-eu). The folder's defaults.yaml carries its
  group values, so base/ can name things '{{ .Values.color }}' and two
  variants never collide.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "%s%s" $ns $suffix | quote }}
  labels:
    namespace: {{ $ns | quote }}
    managed-by: ms-applicationSet
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $repo | quote }}
        revision: {{ $branch | quote }}
        files:
          - path: '{{ $prefix }}{{ $folder }}/values/{{ .Values.valuesGlob | default "*.yaml" }}'
  template:
    metadata:
      name: '{{ printf "{{ .path.filename | trimSuffix \".yaml\" }}" }}-{{ $ns | splitList "-" | last }}{{ $suffix }}'
      labels:
        namespace: {{ $ns | quote }}
        managed-by: ms-applicationSet
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: {{ .Values.project | quote }}
      destination:
        {{- if .Values.destinationName }}
        name: {{ .Values.destinationName | quote }}
        {{- else }}
        server: {{ .Values.destinationServer | quote }}
        {{- end }}
        namespace: {{ $ns | quote }}
      sources:
        - repoURL: {{ .Values.chartRepoURL | quote }}
          targetRevision: {{ .Values.chartRevision | quote }}
          path: {{ .Values.chartPath | quote }}
          helm:
            # The file name, not the Application name (which carries the
            # namespace suffix) — so resources are named after the microservice
            # without a nameOverride in every values file.
            releaseName: '{{ printf "{{ .path.filename | trimSuffix \".yaml\" }}" }}'
            valueFiles:
              - '$Values/{{ $prefix }}base/{{ printf "{{ .path.filename }}" }}'
              - '$Values/{{ $prefix }}{{ $folder }}/defaults.yaml'
              - '$Values/{{ printf "{{ .path.path }}/{{ .path.filename }}" }}'
        - repoURL: {{ $repo | quote }}
          targetRevision: {{ $branch | quote }}
          ref: Values
      syncPolicy:
        {{- /* toString: Argo CD hands helm parameters over as --set, but a
               value typed into its UI or a values file may arrive as "false". */}}
        {{- if ne (toString .Values.autoSync) "false" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # OpenShift/Kubernetes admission mutates these on the LIVE object; Helm's
      # desired manifest never sets them, so without this every Application
      # flips OutOfSync -> Synced on each reconcile and selfHeal fights the
      # cluster's own admission controllers. StatefulSet volumeClaimTemplates is
      # immutable post-creation, so a diff there can never be applied at all.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
            - .spec.volumeClaimTemplates
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
        - group: ""
          kind: ServiceAccount
          jsonPointers:
            - /secrets
            - /imagePullSecrets
