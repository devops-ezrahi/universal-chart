{{- $ns := required "namespace is required" .Values.namespace -}}
{{- $repo := required "originRepoURL is required" .Values.originRepoURL -}}
{{- $branch := required "originBranch is required" .Values.originBranch -}}
{{- $prefix := "" -}}
{{- if .Values.originPath }}{{- $prefix = printf "%s/" .Values.originPath -}}{{- end -}}
{{- $folder := .Values.folder | default $ns -}}
{{- $suffix := ternary "" (printf "-%s" (trimPrefix (printf "%s/" $ns) $folder | replace "/" "-")) (eq $folder $ns) -}}
{{- /* Settings that live in each values repo's rootApplicationSet.yaml (helm
       parameters), never in values.yaml. Each falls back here to the value it
       had before it moved, so a root file that leaves one out keeps working. */ -}}
{{- $chartRepoURL := .Values.chartRepoURL | default "https://github.com/devops-ezrahi/universal-chart.git" -}}
{{- $chartRevision := .Values.chartRevision | default "main" -}}
{{- $chartPath := .Values.chartPath | default "." -}}
{{- $destinationServer := .Values.destinationServer | default "https://kubernetes.default.svc" -}}
{{- /* hasKey, not default: false/"false" must stay false. Absent = true. */ -}}
{{- $preserve := ternary (toString .Values.preserveResourcesOnDeletion) "true" (hasKey .Values "preserveResourcesOnDeletion") | lower -}}
{{- $autoSyncIn := ternary (toString .Values.autoSync) "true" (hasKey .Values "autoSync") | lower -}}
{{- /* The namespace's ConfigMaps Application (see "ConfigMaps folder" below):
       values/<cmFile> lists, under <cmListKey>, which <folder>/<cmDir>/*.yaml
       files to deploy. Off with configMaps.enabled "false". */ -}}
{{- $cmOn := ne (lower (toString (dig "configMaps" "enabled" "true" .Values.AsMap))) "false" -}}
{{- $cmFile := dig "configMaps" "file" "configMaps.yaml" .Values.AsMap | toString -}}
{{- $cmDir := dig "configMaps" "dir" "configMaps" .Values.AsMap | toString | trimSuffix "/" -}}
{{- $cmListKey := dig "configMaps" "listKey" "configMapFiles" .Values.AsMap | toString -}}
{{- /* The Application's name, as a goTemplate expression for the ApplicationSet.
       The ConfigMaps file is named after its folder, lower-cased: configMaps.yaml
       would make "configMaps-dev", which Kubernetes rejects. */ -}}
{{- $appStem := "{{ .path.filename | trimSuffix \".yaml\" }}" -}}
{{- if $cmOn -}}
{{- $appStem = printf "{{ if eq .path.filename %s }}%s{{ else }}{{ .path.filename | trimSuffix \".yaml\" }}{{ end }}" ($cmFile | quote) ($cmFile | trimSuffix ".yaml" | trimSuffix ".yml" | lower) -}}
{{- end -}}
{{- $appName := printf "%s-%s%s" $appStem ($ns | splitList "-" | last) $suffix -}}
{{- /* Links (see values.yaml `links`). $fileUrl holds PATH where a repo path
       goes (a replace, not printf: a web URL may carry %-escapes): Bitbucket Server browses at /browse/<path>?at=<branch>,
       GitHub at /blob/<branch>/<path>, GitLab at /-/blob/<branch>/<path>. */ -}}
{{- $links := .Values.links | default dict -}}
{{- $argocd := trimSuffix "/" ($links.argocdUrl | default "") -}}
{{- $argocdNs := $links.argocdNamespace | default .Release.Namespace -}}
{{- $web := trimSuffix "/" ($links.repoWebUrl | default "") -}}
{{- $bare := trimSuffix ".git" $repo -}}
{{- if and (not $web) (regexMatch "^https?://[^@]+/scm/[^/]+/[^/]+$" $bare) -}}
{{- $web = regexReplaceAll "^(https?://.+)/scm/([^/]+)/([^/]+)$" $bare "${1}/projects/${2}/repos/${3}" -}}
{{- else if and (not $web) (regexMatch "^https://(github\\.com|gitlab\\.com)/" $bare) -}}
{{- $web = $bare -}}
{{- end -}}
{{- /* SSH, which most values repos are cloned over: ssh://git@host[:port]/<path>
       (Bitbucket Server's own form, port 7999) or scp-style git@host:<path>. The
       web UI is taken to be https on the same host, without the SSH port. A
       Bitbucket path is <project>/<repo>; its project key is upper case in the
       web UI however the clone URL spells it, and ~user is a personal repo. */ -}}
{{- $sshHost := "" -}}
{{- $sshPath := "" -}}
{{- if and (not $web) (regexMatch "^ssh://[^@/]+@[^/:]+(:[0-9]+)?/.+$" $bare) -}}
{{- $sshHost = regexReplaceAll "^ssh://[^@/]+@([^/:]+)(:[0-9]+)?/(.+)$" $bare "${1}" -}}
{{- $sshPath = regexReplaceAll "^ssh://[^@/]+@([^/:]+)(:[0-9]+)?/(.+)$" $bare "${3}" -}}
{{- else if and (not $web) (regexMatch "^[^@/:]+@[^/:]+:[^/].*$" $bare) -}}
{{- $sshHost = regexReplaceAll "^[^@/:]+@([^/:]+):(.+)$" $bare "${1}" -}}
{{- $sshPath = regexReplaceAll "^[^@/:]+@([^/:]+):(.+)$" $bare "${2}" -}}
{{- end -}}
{{- if $sshHost -}}
{{- if has $sshHost (list "github.com" "gitlab.com") -}}
{{- $web = printf "https://%s/%s" $sshHost $sshPath -}}
{{- else if regexMatch "^(scm/)?[^/]+/[^/]+$" $sshPath -}}
{{- $parts := regexReplaceAll "^scm/" $sshPath "" | splitList "/" -}}
{{- $project := index $parts 0 -}}
{{- if hasPrefix "~" $project -}}
{{- $web = printf "https://%s/users/%s/repos/%s" $sshHost (trimPrefix "~" $project) (index $parts 1) -}}
{{- else -}}
{{- $web = printf "https://%s/projects/%s/repos/%s" $sshHost (upper $project) (index $parts 1) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Set in full, never derived: a values repo can span several clusters
       and several Argo CDs, and no URL here says which console is whose. */ -}}
{{- $console := trimSuffix "/" ($links.consoleUrl | default "") -}}
{{- $fileUrl := "" -}}
{{- if $web -}}
{{- if regexMatch "/(projects|users)/[^/]+/repos/[^/]+$" $web -}}
{{- $fileUrl = printf "%s/browse/PATH?at=%s" $web $branch -}}
{{- else if contains "gitlab" $web -}}
{{- $fileUrl = printf "%s/-/blob/%s/PATH" $web $branch -}}
{{- else -}}
{{- $fileUrl = printf "%s/blob/%s/PATH" $web $branch -}}
{{- end -}}
{{- end -}}
{{- /* A values file holding `BaseFile: x` (or `x.yaml`) reads base/x.yaml, so
       one base serves every copy of a release deployed side by side in one
       namespace, whatever the copies are called. Argo CD's git files generator
       hands the template each file's own top-level keys. Any other file reads
       the base of its own name. */ -}}
{{- $baseName := "{{ if hasKey . \"BaseFile\" }}{{ .BaseFile | toString | trimSuffix \".yaml\" }}.yaml{{ else }}{{ .path.filename }}{{ end }}" -}}
{{- $baseFile := printf "%sbase{{ .path.path | trimPrefix \"%s%s/values\" }}/%s" $prefix $prefix $folder $baseName -}}
{{- $defaultsFile := printf "%s%s/defaults.yaml" $prefix $folder -}}
{{- $valuesFile := "{{ .path.path }}/{{ .path.filename }}" -}}
{{/*
  One ApplicationSet for ONE namespace. Its git "files" generator enumerates
  <namespace>/values/*.yaml in the values repo - that flat directory IS the list
  of releases, so adding a microservice is adding a file, nothing else.

  Every generated Application layers the SAME three value files, lowest -> highest:
    base/<file>                    app      - comprehensive, environment-agnostic, SHARED across namespaces
    <folder>/defaults.yaml         folder   - identical across every microservice here, plus the
                                              group values it stands for (color: yellow, environment: dev)
    <folder>/values/<file>         instance - image tag + literal env + this folder's tweaks
  The filename is the same in base/ and values/, which is what keeps the chain
  self-consistent for a given release.

  Instances: one release deployed several times in the same namespace
  (x-1, x-2, x-3, or alpha, beta, gamma) shares ONE base. Each values file
  carries `BaseFile: x` - which base it layers, read here by Argo CD - and
  `instance: <id>` - what base/ fills in as {{ .Values.instance }}, read by
  Helm. Each file is still its own Application and Helm release.

  values/ may hold sub-folders for grouping (values/group1/ms1.yaml): a release
  is still named after its file, and base/ mirrors the sub-folder, so it reads
  base/group1/ms1.yaml. base/ is shared, so every folder deploying ms1 must keep
  it in the same sub-folder. File names must stay unique per namespace.
  Legacy git-file globbing lets '*' cross '/', so the default glob finds them;
  with --enable-new-git-file-globbing set valuesGlob (see values.yaml).

  Variant folders (<namespace>/<variant>/..., e.g. prd/yellow and prd/black, both
  deploying into namespace prd and sharing the one base/): namespace=prd,
  folder=prd/yellow. The folder below the namespace is appended to every
  generated name (ApplicationSet prd-yellow, Application ms1-prd-yellow;
  prd/yellow/eu -> ms1-prd-yellow-eu). The folder's defaults.yaml carries its
  group values, so base/ can name things '{{ .Values.color }}' and two
  variants never collide.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "%s%s" $ns $suffix | quote }}
  labels:
    namespace: {{ $ns | quote }}
    managed-by: ms-applicationSet
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  {{- /* Built as a dict and written only when it holds something: a bare
         `syncPolicy:` key is null, and the ApplicationSet CRD rejects
         spec.syncPolicy null outright ("must be of type object"), which fails
         the whole sync. toString/lower: an Argo CD helm parameter arrives as
         a string ("true", "True"). */}}
  {{- $appsetSync := dict }}
  {{- if eq $preserve "true" }}
  {{- $_ := set $appsetSync "preserveResourcesOnDeletion" true }}
  {{- end }}
  {{- with trim (toString (.Values.applicationsSync | default "")) }}
  {{- $_ := set $appsetSync "applicationsSync" . }}
  {{- end }}
  {{- with $appsetSync }}
  syncPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* A matrix of the folder's values files and its defaults.yaml, so each
         Application also sees defaults.yaml's top-level keys (autoSync, read
         in templatePatch below). pathParamPrefix keeps defaults.yaml's own
         path under .defaults, so .path is still the values file. */}}
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ $repo | quote }}
              revision: {{ $branch | quote }}
              files:
                - path: '{{ $prefix }}{{ $folder }}/values/{{ .Values.valuesGlob | default "*.yaml" }}'
          - git:
              repoURL: {{ $repo | quote }}
              revision: {{ $branch | quote }}
              pathParamPrefix: defaults
              files:
                - path: '{{ $defaultsFile }}'
  template:
    metadata:
      name: '{{ $appName }}'
      labels:
        namespace: {{ $ns | quote }}
        {{- /* What the ConsoleLink filters Argo CD's list on; a label value
               cannot hold the slash a variant folder has. */}}
        folder: {{ $folder | replace "/" "-" | trunc 63 | trimSuffix "-" | quote }}
        managed-by: ms-applicationSet
      annotations:
        argocd.argoproj.io/sync-wave: "0"
        {{- with $fileUrl }}
        # Argo CD shows this one on the Application's tile and summary.
        link.argocd.argoproj.io/external-link: '{{ replace "PATH" $valuesFile . }}'
        universal-chart/values-file: '{{ replace "PATH" $valuesFile . }}'
        universal-chart/defaults-file: '{{ replace "PATH" $defaultsFile . }}'
        universal-chart/base-file: '{{ replace "PATH" $baseFile . }}'
        {{- end }}
    spec:
      project: {{ .Values.project | quote }}
      destination:
        {{- if .Values.destinationName }}
        name: {{ .Values.destinationName | quote }}
        {{- else }}
        server: {{ $destinationServer | quote }}
        {{- end }}
        namespace: {{ $ns | quote }}
      sources:
        - repoURL: {{ $chartRepoURL | quote }}
          targetRevision: {{ $chartRevision | quote }}
          path: {{ $chartPath | quote }}
          helm:
            valueFiles:
              - '$Values/{{ $baseFile }}'
              - '$Values/{{ $defaultsFile }}'
              - '$Values/{{ $valuesFile }}'
            {{- /* The workload's two clickable links: the OpenShift topology
                   badge to its Application, and its Argo CD tree node to its
                   console page. Each only when its URL is set;
                   links.objects: false turns both off. */}}
            {{- if and (ne (toString $links.objects) "false") (or $argocd $console) }}
            parameters:
              {{- with $argocd }}
              - name: links.argocd
                value: '{{ . }}/applications/{{ $argocdNs }}/{{ $appName }}'
                forceString: true
              {{- end }}
              {{- with $console }}
              - name: links.console
                value: {{ . | quote }}
                forceString: true
              {{- end }}
            {{- end }}
        - repoURL: {{ $repo | quote }}
          targetRevision: {{ $branch | quote }}
          ref: Values
      # OpenShift/Kubernetes admission mutates these on the LIVE object; Helm's
      # desired manifest never sets them, so without this every Application
      # flips OutOfSync -> Synced on each reconcile and selfHeal fights the
      # cluster's own admission controllers. StatefulSet volumeClaimTemplates is
      # immutable post-creation, so a diff there can never be applied at all.
      # restartedAt is stamped by `oc rollout restart`: a record of a manual
      # restart, not configuration, so it must not read as drift.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
            - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'
            - '.spec.template.metadata.annotations["openshift.openshift.io/restartedAt"]'
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
            - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'
            - '.spec.template.metadata.annotations["openshift.openshift.io/restartedAt"]'
            - .spec.volumeClaimTemplates
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.spec.securityContext.runAsUser
            - .spec.template.spec.securityContext.runAsGroup
            - .spec.template.spec.securityContext.fsGroup
            - .spec.template.spec.securityContext.seLinuxOptions
            - .spec.template.spec.containers[]?.securityContext.runAsUser
            - .spec.template.spec.containers[]?.securityContext.capabilities
            - '.spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]'
            - '.spec.template.metadata.annotations["openshift.openshift.io/restartedAt"]'
        # Defaulted by the API server on every Service; never in the chart.
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/ipFamilies
            - /spec/ipFamilyPolicy
        - group: ""
          kind: ServiceAccount
          jsonPointers:
            - /secrets
            - /imagePullSecrets
  {{- /* syncPolicy per Application. `autoSync: true|false` in the folder's
         defaults.yaml wins; the chart's autoSync (passed by the root
         ApplicationSet) is the fallback. Argo CD evaluates the dig per
         Application, so a goTemplate decides whether `automated` exists at
         all, which only templatePatch can do (Argo CD 2.10+). toString/lower:
         a helm parameter arrives as a string ("true", "False") and a YAML
         boolean in defaults.yaml as a bool; anything but "false" is on. */}}
  {{- $autoSync := ternary "false" "true" (eq $autoSyncIn "false") }}
  {{- /* ConfigMaps folder. values/<cmFile> is not a microservice: it lists,
         under <cmListKey>, which <folder>/<cmDir>/<name>.yaml files to deploy
         (chart values snippets, e.g. configMaps: {env1: {data: ...}}). Its
         Application layers those files in list order, then the list file
         itself, and nothing else: no base/ (it has none) and no defaults.yaml
         (that holds the microservices' workload settings). workload.type=none
         renders no pods, only what the files define. The source list varies
         per Application, so only the goTemplate templatePatch can build it; a
         patch replaces spec.sources whole. Every other Application is left as
         the template above writes it. */}}
  {{- $cmAppName := printf "%s-%s%s" ($cmFile | trimSuffix ".yaml" | trimSuffix ".yml" | lower) ($ns | splitList "-" | last) $suffix }}
  templatePatch: |
    {{- if $cmOn }}
    {{ printf "{{- if eq .path.filename %s }}" ($cmFile | quote) }}
    {{ printf "{{- if not (hasKey . %s) }}{{ fail %s }}{{ end }}" ($cmListKey | quote) (printf "%s%s/values/%s must list the %s/ files to deploy under %s" $prefix $folder $cmFile $cmDir $cmListKey | quote) }}
    {{- if $fileUrl }}
    metadata:
      annotations:
        universal-chart/base-file: null
        universal-chart/defaults-file: null
    {{- end }}
    {{ "{{- end }}" }}
    {{- end }}
    spec:
      {{- if $cmOn }}
      {{ printf "{{- if eq .path.filename %s }}" ($cmFile | quote) }}
      sources:
        - repoURL: {{ $chartRepoURL | quote }}
          targetRevision: {{ $chartRevision | quote }}
          path: {{ $chartPath | quote }}
          helm:
            valueFiles:
              {{ printf "{{- range (index . %s) }}" ($cmListKey | quote) }}
              - '$Values/{{ $prefix }}{{ $folder }}/{{ $cmDir }}/{{ "{{" }} . | toString | trimSuffix ".yaml" {{ "}}" }}.yaml'
              {{ "{{- end }}" }}
              - '$Values/{{ $valuesFile }}'
            parameters:
              - name: workload.type
                value: none
              {{- if ne (toString $links.objects) "false" }}
              {{- with $argocd }}
              - name: links.argocd
                value: {{ printf "%s/applications/%s/%s" . $argocdNs $cmAppName | quote }}
                forceString: true
              {{- end }}
              {{- with $console }}
              - name: links.console
                value: {{ . | quote }}
                forceString: true
              {{- end }}
              {{- end }}
        - repoURL: {{ $repo | quote }}
          targetRevision: {{ $branch | quote }}
          ref: Values
      {{ "{{- end }}" }}
      {{- end }}
      syncPolicy:
        {{ printf "{{- if ne (dig \"autoSync\" \"%s\" . | toString | lower) \"false\" }}" $autoSync }}
        automated:
          prune: true
          selfHeal: true
        {{ "{{- end }}" }}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
