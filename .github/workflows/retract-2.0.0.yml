# One-shot: tidy the v1.2.0 notes re-cut from v2.0.0. Removed right after.
name: Retract v2.0.0 as v1.2.0

on:
  workflow_dispatch:

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.2.0 --json body --jq .body > notes.md
          python3 - notes.md <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          s = s.replace("* feat(converter)!: --exact-copy for restart-free cutover, clean by default",
                        "* **converter:** --exact-copy for restart-free cutover, clean by default")
          # The stray line sits above Bug Fixes; move it under Features.
          m = re.search(r"\n\n(\* \*\*converter:\*\* --exact-copy[^\n]*)\n", s)
          line = m.group(1)
          s = s.replace(m.group(0), "\n", 1)
          s = s.replace("### Features\n\n", "### Features\n\n" + line + "\n", 1)
          s = re.sub(r"\n+### BREAKING CHANGES.*", "\n\n### Note\n\n* A new conversion restarts pods at cutover unless `--exact-copy` is passed. The chart's templates and values keys are unchanged.\n", s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat notes.md
          gh release edit v1.2.0 --notes-file notes.md
