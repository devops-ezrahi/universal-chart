# -- Set this to your microservice's own name. When set, resource names are
# exactly this value (trunc'd to Kubernetes' length limits) — NOT
# "<release>-<chart-name>". GitOps generators should always set this.
nameOverride: ""
# -- Same idea as nameOverride but wins over it too; rarely needed directly.
fullnameOverride: ""

# -- Extra labels added to ALL resources
commonLabels: {}
# false = every object gets exactly its own `labels` (+ commonLabels), with no
# chart identity labels (name/instance/managed-by). The
# converter sets it so a migrated object keeps its live labels one-to-one.
chartLabels: true
# Overrides the computed selector (app.kubernetes.io/name + instance) used by
# workload matchLabels, pod template labels and Service/PDB selectors. Selectors
# are immutable, so a migrated workload must keep its live ones.
selectorLabels: {}
# -- Extra annotations added to ALL resources
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Workload type — pick ONE
# ---------------------------------------------------------------------------
workload:
  type: deployment   # deployment | statefulset | daemonset | none
  # "none" renders no Deployment/StatefulSet/DaemonSet at all — for config/RBAC-only
  # microservices (ServiceAccounts, Roles, ConfigMaps) with no compute workload.
  # Pair with `service.enabled: false`, `hpa.enabled: false`, `pdb.enabled: false`.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: nginx
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # pin by digest instead of tag, e.g. "sha256:abcdef..."
                      # (takes precedence over tag; also safe to instead put
                      # "repo@sha256:..." directly in repository)
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ---------------------------------------------------------------------------
# Replicas & update strategy
# ---------------------------------------------------------------------------
# Name of the ONE container this chart manages. Defaults to the release name.
# Set it to keep the source manifest's own container name, which is what
# `kubectl logs -c` / `exec -c`, log-pipeline container selectors and the
# `container` label on kubelet metrics all match on. Jobs and CronJobs have
# their own per-entry `containerName` (defaulting to the map key).
containerName: ""

replicaCount: 1
revisionHistoryLimit: 3

# Deployment only: seconds Kubernetes waits before marking a rollout failed.
# Empty means the field is omitted and Kubernetes applies its own default (600).
progressDeadlineSeconds: ""

# Deployment only: seconds a newly-Ready pod must stay Ready before the rollout
# moves on. Empty means the field is omitted and Kubernetes applies its own
# default, which is 0 — i.e. no soak at all. Unlike progressDeadlineSeconds
# there is no benign default here: if the source declared a value, losing it
# genuinely changes rollout behaviour, so the converter carries whatever it
# finds and the template renders it only when set.
minReadySeconds: ""
podManagementPolicy: OrderedReady   # StatefulSet only: OrderedReady | Parallel

# StatefulSet only: the GOVERNING Service, which gives each pod its stable DNS
# name <pod>.<serviceName>.<ns>.svc. Defaults to the release fullname. Set it
# when the governing Service is a dedicated headless one (the usual pattern for
# clustered data systems, e.g. `redis-cache-headless`) — only a headless
# Service publishes per-pod A records, so pointing this at a regular ClusterIP
# Service silently breaks peer discovery and cluster formation.
serviceName: ""

strategy: {}
# Deployment:   type: RollingUpdate | Recreate
# StatefulSet:  type: RollingUpdate | OnDelete
# DaemonSet:    type: RollingUpdate | OnDelete

# ---------------------------------------------------------------------------
# Pod metadata
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}
# ---------------------------------------------------------------------------
# Security Contexts
# ---------------------------------------------------------------------------
podSecurityContext: {}
# -- Main container securityContext. Unset (null) renders nothing; an explicit
# `{}` renders `securityContext: {}` (kept so a migrated pod template that
# carried an empty one is reproduced exactly, and its pods are not restarted).
securityContext: null

# ---------------------------------------------------------------------------
# Container — main container spec
# ---------------------------------------------------------------------------
command: []
args: []
workingDir: ""
stdin: false
stdinOnce: false
tty: false
terminationMessagePath: /dev/termination-log
terminationMessagePolicy: File

# ---------------------------------------------------------------------------
# Ports — MAP-BASED (keyed by port name for deep-merge)
# ---------------------------------------------------------------------------
ports: {}
# http:
#   containerPort: 8080
#   protocol: TCP
# grpc:
#   containerPort: 9090
# -- Render order of ports / envFrom / volumes / sidecars, by map key. Keys not
# listed follow in sorted order. Kubernetes stores these as lists, so a
# different order is a pod-template change (= pods restart). The converter
# writes them in the raw manifest's order under --exact-copy (no restart at
# cutover); otherwise only initContainerOrder and envFromOrder.
# env and volumeMounts have no order key: write them as lists and they render
# exactly in the order written.
portOrder: []
envFromOrder: []
volumeOrder: []
sidecarOrder: []

# ---------------------------------------------------------------------------
# Environment variables — a LIST, rendered in the order written (the
# deployment's own order; `$(VAR)` expands only vars defined earlier).
# A later values file replaces the whole list. The older map form (keyed by
# env var name, `MY_VAR: {value: hello}`) still works but renders sorted by name.
# ---------------------------------------------------------------------------
env: ~
# - name: MY_VAR
#   value: "hello"
# - name: POD_NAME
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.name
# - name: DB_HOST
#   valueFrom:
#     configMapKeyRef:
#       name: my-config
#       key: db-host
# - name: DB_PASS
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password

# ---------------------------------------------------------------------------
# envFrom — MAP-BASED (keyed by configmap/secret name)
# ---------------------------------------------------------------------------
envFrom: {}
# my-config:
#   type: configMapRef
# my-secret:
#   type: secretRef
#   optional: true

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   cpu: 500m
#   memory: 256Mi

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe: {}
readinessProbe: {}
startupProbe: {}

# ---------------------------------------------------------------------------
# Container Restart Rules (alpha — K8s 1.35+)
# ---------------------------------------------------------------------------
containerRestartRules: []
# - exitCode: 42
#   action: RestartAllContainers

# The MAIN CONTAINER's own restartPolicy — not the pod's, which is
# `restartPolicy` above. "Always" restarts this container in place instead of
# failing the pod (K8s 1.33+); on an initContainer the same value is what makes
# it a native sidecar (1.28+). Empty means the field is omitted entirely.
containerRestartPolicy: ""

# ---------------------------------------------------------------------------
# Lifecycle hooks
# ---------------------------------------------------------------------------
lifecycle: {}

# ---------------------------------------------------------------------------
# Volume Mounts — a LIST, rendered in the order written. A later values file
# replaces the whole list. The older map form (keyed by mount name) still
# works but renders sorted by name.
# ---------------------------------------------------------------------------
volumeMounts: ~
# - name: config
#   mountPath: /etc/config
#   readOnly: true
# - name: data
#   mountPath: /data
#   subPath: myapp-data

volumeDevices: []

# ---------------------------------------------------------------------------
# Volumes — MAP-BASED (keyed by volume name)
# ---------------------------------------------------------------------------
volumes: {}
# config-vol:
#   configMap:
#     name: my-configmap
# secret-vol:
#   secret:
#     secretName: my-secret
# tmp:
#   emptyDir: {}
# data:
#   persistentVolumeClaim:
#     claimName: my-pvc

# ---------------------------------------------------------------------------
# Init containers — MAP-BASED (keyed by container name)
# ---------------------------------------------------------------------------
# Run order for initContainers (a map renders in sorted key order otherwise).
# Names not listed here run after the listed ones, sorted.
# initContainerOrder: [wait-for-db, migrate]
initContainers: {}
# init-db:
#   image: busybox:1.36
#   command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]

# ---------------------------------------------------------------------------
# Sidecar containers — MAP-BASED (keyed by container name)
# ---------------------------------------------------------------------------
sidecars: {}
# log-shipper:
#   image: fluentbit:2.0
#   env:
#     - name: LOG_LEVEL
#       value: info
#   resources:
#     requests:
#       cpu: 50m
#       memory: 64Mi

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Advanced pod settings
# ---------------------------------------------------------------------------
hostNetwork: false
hostIPC: false
hostPID: false
shareProcessNamespace: false
priorityClassName: ""
runtimeClassName: ""
schedulerName: ""
restartPolicy: ""
dnsPolicy: ""
dnsConfig: {}
hostAliases: []
readinessGates: []
overhead: {}
terminationGracePeriodSeconds: 30

# ---------------------------------------------------------------------------
# Service — ports are MAP-BASED (keyed by port name)
# ---------------------------------------------------------------------------
# Off by default: set `enabled: true` to render the Service (and `false` to
# turn it back off in a later values file).
service:
  enabled: false
  type: ClusterIP
  # Map-keyed by port name — Helm merges maps key-by-key, so leaving a
  # default port here would silently survive alongside (not get replaced by)
  # any caller's own -f values.yaml that names its ports differently, and
  # would target a "http"-named container port that may not exist. Declare
  # ports explicitly per release instead (see COOKBOOK.md / README.md).
  # selector: {}               # explicit pod selector; default is this release's own labels
  # trafficDistribution: PreferClose
  ports: {}
  # http:
  #   port: 80
  #   targetPort: http
  #   protocol: TCP
  #   # nodePort: 30080    # for NodePort/LoadBalancer
  annotations: {}
  labels: {}
  # clusterIP: None
  # externalName: my.db.example.com
  # externalTrafficPolicy: Cluster
  # sessionAffinity: ClientIP

# ---------------------------------------------------------------------------
# Extra Services — MAP-BASED (keyed by service name), beyond the primary one
# above. For microservices that need more than one Service object.
# ---------------------------------------------------------------------------
services: {}
# admin:
#   enabled: true
#   type: ClusterIP
#   ports:
#     admin-http:
#       port: 8081

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: myapp.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  #       portName: http
  #     - path: /api
  #       serviceName: api-server   # this path's own backend (default: ingress.serviceName, then the primary Service)
  #       portNumber: 8080          # a numbered backend port instead of portName
  tls: []

# ---------------------------------------------------------------------------
# OpenShift Route
# ---------------------------------------------------------------------------
route:
  enabled: false
  host: ""
  path: ""
  targetPort: ""
  annotations: {}
  tls:
    termination: edge
    # -- Rendered only when set (None / Allow / Redirect). Not defaulted: a
    # Route that never had it must not silently start redirecting HTTP.
    # insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# Extra OpenShift Routes — MAP-BASED (keyed by route name), beyond the
# primary one above. For microservices fronting more than one hostname/path.
# ---------------------------------------------------------------------------
routes: {}
# admin-console:
#   enabled: true
#   host: admin.apps.cluster.example.com
#   targetPort: admin-http

# ---------------------------------------------------------------------------
# OpenShift SecurityContextConstraints — MAP-BASED (keyed by SCC name)
# ---------------------------------------------------------------------------
scc: {}
# restricted-custom:
#   allowPrivilegedContainer: false
#   allowPrivilegeEscalation: false
#   requiredDropCapabilities: [ALL]
#   runAsUser:
#     type: MustRunAsRange
#   seLinuxContext:
#     type: MustRunAs
#   fsGroup:
#     type: MustRunAs
#   supplementalGroups:
#     type: RunAsAny
#   volumes: [configMap, downwardAPI, emptyDir, persistentVolumeClaim, projected, secret]
#   allowHostNetwork: false
#   allowHostPorts: false
#   allowHostPID: false
#   allowHostIPC: false
#   readOnlyRootFilesystem: false
#   users:
#     - system:serviceaccount:myns:mysa
#   groups: []
#   priority: null

# ---------------------------------------------------------------------------
# ConfigMaps — MAP-BASED (keyed by configmap name)
# ---------------------------------------------------------------------------
configMaps: {}
# app-config:
#   data:
#     LOG_LEVEL: info
#     app.conf: |
#       key=value
#   annotations: {}
#   labels: {}

# ---------------------------------------------------------------------------
# Secrets — MAP-BASED (keyed by secret name)
# ---------------------------------------------------------------------------
secrets: {}
# app-secret:
#   type: Opaque
#   stringData:
#     DB_PASSWORD: "secret"

# ---------------------------------------------------------------------------
# External Secrets Operator (https://external-secrets.io) — requires the ESO
# CRDs installed on the cluster; this chart only renders the custom
# resources, not the operator. All three are MAP-BASED (keyed by name).
# ---------------------------------------------------------------------------
externalSecretsApiVersion: external-secrets.io/v1

# SecretStore — namespaced, defines where ExternalSecrets in THIS namespace
# pull from (Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret
# Manager, ...). Skip this if you already have one and just reference its
# name from externalSecrets below.
secretStores: {}
# vault-backend:
#   provider:
#     vault:
#       server: https://vault.example.com:8200
#       path: secret
#       version: v2
#       auth:
#         kubernetes:
#           mountPath: kubernetes
#           role: my-role
#           serviceAccountRef:
#             name: my-app

# ClusterSecretStore — cluster-scoped counterpart to SecretStore. Usually
# owned by a platform release, not by individual microservices — see the
# comment in templates/clustersecretstore.yaml before using this per-app.
clusterSecretStores: {}

# ExternalSecret — syncs remote keys into a REAL Kubernetes Secret (named
# after the map key by default) that the rest of this chart consumes
# exactly like any other Secret (env/envFrom/volumes reference it by name).
externalSecrets: {}
# db-credentials:
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore        # or ClusterSecretStore
#   refreshInterval: 1h
#   target:
#     name: db-credentials     # defaults to the map key
#     creationPolicy: Owner
#   data:
#     - secretKey: password
#       remoteRef:
#         key: secret/data/myapp/db
#         property: password

# ---------------------------------------------------------------------------
# PVCs — MAP-BASED (keyed by PVC name)
# ---------------------------------------------------------------------------
pvc: {}
# my-data:
#   accessModes: [ReadWriteOnce]
#   size: 10Gi
#   storageClassName: ""

# ---------------------------------------------------------------------------
# PersistentVolumes — MAP-BASED (keyed by PV name)
# ---------------------------------------------------------------------------
persistentVolumes: {}

# ---------------------------------------------------------------------------
# StorageClasses — MAP-BASED (keyed by SC name)
# ---------------------------------------------------------------------------
storageClasses: {}
# fast-ssd:
#   provisioner: ebs.csi.aws.com
#   parameters:
#     type: gp3

# ---------------------------------------------------------------------------
# StatefulSet volumeClaimTemplates — MAP-BASED (keyed by VCT name)
# ---------------------------------------------------------------------------
volumeClaimTemplates: {}
# data:
#   accessModes: [ReadWriteOnce]
#   size: 20Gi
#   storageClassName: fast-ssd

# What happens to the volumeClaimTemplates' PVCs when the StatefulSet is
# deleted or scaled down. StatefulSet only; ignored by the other workload
# types. Left EMPTY on purpose so the rendered StatefulSet omits the field and
# Kubernetes applies its own default — setting `Retain` here would be safer for
# data but would silently override the intent of every chart user who wants the
# default, and would show up as an invented field in a raw-vs-rendered diff.
# Set it explicitly for anything holding state you cannot re-create.
persistentVolumeClaimRetentionPolicy: {}
# whenDeleted: Retain   # Retain | Delete  (K8s default: Delete)
# whenScaled: Retain    # Retain | Delete  (K8s default: Delete)

# ---------------------------------------------------------------------------
# CronJobs — MAP-BASED (keyed by cronjob name)
# ---------------------------------------------------------------------------
cronjobs: {}
# backup:
#   schedule: "0 2 * * *"
#   concurrencyPolicy: Forbid
#   jobTemplate:
#     backoffLimit: 3
#     restartPolicy: OnFailure
#     command: ["/bin/backup.sh"]

# ---------------------------------------------------------------------------
# Jobs — MAP-BASED (keyed by job name)
# ---------------------------------------------------------------------------
jobs: {}
# migrate:
#   command: ["python", "manage.py", "migrate"]
#   restartPolicy: OnFailure
#   backoffLimit: 3
#   annotations:
#     argocd.argoproj.io/hook: PreSync

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
# Pod-level token mount, separate from the ServiceAccount's own setting below.
# Unset: the pod follows serviceAccount.automountServiceAccountToken.
# automountServiceAccountToken: true
# Off by default: the pods run as `name` when set, otherwise the namespace's
# `default` ServiceAccount. `create: true` renders one (named `name`, or after
# the release); `create: false` turns it back off.
serviceAccount:
  create: false
  name: ""
  annotations: {}
  # Unset = not rendered (Kubernetes default: mounted). Set true/false to pin it.
  # automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# RBAC — MAP-BASED (keyed by role/binding name)
# ---------------------------------------------------------------------------
rbac:
  roles: {}
  # my-role:
  #   rules:
  #     - apiGroups: [""]
  #       resources: ["pods"]
  #       verbs: ["get", "list"]

  roleBindings: {}
  # my-rb:
  #   roleRef: my-role
  #   subjects:
  #     - kind: ServiceAccount
  #       name: my-sa

  clusterRoles: {}
  clusterRoleBindings: {}

# ---------------------------------------------------------------------------
# HPA
# ---------------------------------------------------------------------------
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  metrics: []
  behavior: {}

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# ---------------------------------------------------------------------------
pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# ---------------------------------------------------------------------------
# NetworkPolicies — MAP-BASED (keyed by policy name)
# ---------------------------------------------------------------------------
networkPolicies: {}
# allow-ingress:
#   podSelector: {}
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - podSelector:
#             matchLabels:
#               app: frontend

# ---------------------------------------------------------------------------
# Prometheus ServiceMonitor
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  scheme: http
  tlsConfig: {}
  relabelings: []
  metricRelabelings: []

# ---------------------------------------------------------------------------
# VerticalPodAutoscaler
# ---------------------------------------------------------------------------
vpa:
  enabled: false
  updateMode: Auto
  resourcePolicy: {}

# ---------------------------------------------------------------------------
# Raw YAML injection
# ---------------------------------------------------------------------------
extraDeploy: []

# ---------------------------------------------------------------------------
# Checksums — Opt-in Pod Restart on Config Change
# ---------------------------------------------------------------------------
checksums:
  enabled: false