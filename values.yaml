# -- Set this to your microservice's own name. When set, resource names are
# exactly this value (trunc'd to Kubernetes' length limits) — NOT
# "<release>-<chart-name>". GitOps generators should always set this.
nameOverride: ""
# -- Same idea as nameOverride but wins over it too; rarely needed directly.
fullnameOverride: ""

# -- Extra labels added to ALL resources
commonLabels: {}
# -- Extra annotations added to ALL resources
commonAnnotations: {}

# ---------------------------------------------------------------------------
# Workload type — pick ONE
# ---------------------------------------------------------------------------
workload:
  type: deployment   # deployment | statefulset | daemonset | none
  # "none" renders no Deployment/StatefulSet/DaemonSet at all — for config/RBAC-only
  # microservices (ServiceAccounts, Roles, ConfigMaps) with no compute workload.
  # Pair with `service.enabled: false`, `hpa.enabled: false`, `pdb.enabled: false`.

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: nginx
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # pin by digest instead of tag, e.g. "sha256:abcdef..."
                      # (takes precedence over tag; also safe to instead put
                      # "repo@sha256:..." directly in repository)
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ---------------------------------------------------------------------------
# Replicas & update strategy
# ---------------------------------------------------------------------------
replicaCount: 1
revisionHistoryLimit: 3
podManagementPolicy: OrderedReady   # StatefulSet only: OrderedReady | Parallel

strategy: {}
# Deployment:   type: RollingUpdate | Recreate
# StatefulSet:  type: RollingUpdate | OnDelete
# DaemonSet:    type: RollingUpdate | OnDelete

# ---------------------------------------------------------------------------
# Pod metadata
# ---------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# ---------------------------------------------------------------------------
# Security Contexts
# ---------------------------------------------------------------------------
podSecurityContext: {}
securityContext: {}

# ---------------------------------------------------------------------------
# Container — main container spec
# ---------------------------------------------------------------------------
command: []
args: []
workingDir: ""
stdin: false
stdinOnce: false
tty: false
terminationMessagePath: /dev/termination-log
terminationMessagePolicy: File

# ---------------------------------------------------------------------------
# Ports — MAP-BASED (keyed by port name for deep-merge)
# ---------------------------------------------------------------------------
ports: {}
# http:
#   containerPort: 8080
#   protocol: TCP
# grpc:
#   containerPort: 9090

# ---------------------------------------------------------------------------
# Environment variables — MAP-BASED (keyed by env var name)
# ---------------------------------------------------------------------------
env: {}
# MY_VAR:
#   value: "hello"
# POD_NAME:
#   valueFrom:
#     fieldRef:
#       fieldPath: metadata.name
# DB_HOST:
#   valueFrom:
#     configMapKeyRef:
#       name: my-config
#       key: db-host
# DB_PASS:
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password

# ---------------------------------------------------------------------------
# envFrom — MAP-BASED (keyed by configmap/secret name)
# ---------------------------------------------------------------------------
envFrom: {}
# my-config:
#   type: configMapRef
# my-secret:
#   type: secretRef
#   optional: true

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   cpu: 500m
#   memory: 256Mi

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe: {}
readinessProbe: {}
startupProbe: {}

# ---------------------------------------------------------------------------
# Container Restart Rules (alpha — K8s 1.35+)
# ---------------------------------------------------------------------------
containerRestartRules: []
# - exitCode: 42
#   action: RestartAllContainers

# ---------------------------------------------------------------------------
# Lifecycle hooks
# ---------------------------------------------------------------------------
lifecycle: {}

# ---------------------------------------------------------------------------
# Volume Mounts — MAP-BASED (keyed by mount name)
# ---------------------------------------------------------------------------
volumeMounts: {}
# config:
#   mountPath: /etc/config
#   readOnly: true
# data:
#   mountPath: /data
#   subPath: myapp-data

volumeDevices: []

# ---------------------------------------------------------------------------
# Volumes — MAP-BASED (keyed by volume name)
# ---------------------------------------------------------------------------
volumes: {}
# config-vol:
#   configMap:
#     name: my-configmap
# secret-vol:
#   secret:
#     secretName: my-secret
# tmp:
#   emptyDir: {}
# data:
#   persistentVolumeClaim:
#     claimName: my-pvc

# ---------------------------------------------------------------------------
# Init containers — MAP-BASED (keyed by container name)
# ---------------------------------------------------------------------------
initContainers: {}
# init-db:
#   image: busybox:1.36
#   command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]

# ---------------------------------------------------------------------------
# Sidecar containers — MAP-BASED (keyed by container name)
# ---------------------------------------------------------------------------
sidecars: {}
# log-shipper:
#   image: fluentbit:2.0
#   env:
#     - name: LOG_LEVEL
#       value: info
#   resources:
#     requests:
#       cpu: 50m
#       memory: 64Mi

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Advanced pod settings
# ---------------------------------------------------------------------------
hostNetwork: false
hostIPC: false
hostPID: false
shareProcessNamespace: false
priorityClassName: ""
runtimeClassName: ""
schedulerName: ""
restartPolicy: ""
dnsPolicy: ""
dnsConfig: {}
hostAliases: []
readinessGates: []
overhead: {}
terminationGracePeriodSeconds: 30

# ---------------------------------------------------------------------------
# Service — ports are MAP-BASED (keyed by port name)
# ---------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  # Map-keyed by port name — Helm merges maps key-by-key, so leaving a
  # default port here would silently survive alongside (not get replaced by)
  # any caller's own -f values.yaml that names its ports differently, and
  # would target a "http"-named container port that may not exist. Declare
  # ports explicitly per release instead (see COOKBOOK.md / README.md).
  ports: {}
  # http:
  #   port: 80
  #   targetPort: http
  #   protocol: TCP
  #   # nodePort: 30080    # for NodePort/LoadBalancer
  annotations: {}
  labels: {}
  # clusterIP: None
  # externalName: my.db.example.com
  # externalTrafficPolicy: Cluster
  # sessionAffinity: ClientIP

# ---------------------------------------------------------------------------
# Extra Services — MAP-BASED (keyed by service name), beyond the primary one
# above. For microservices that need more than one Service object.
# ---------------------------------------------------------------------------
services: {}
# admin:
#   enabled: true
#   type: ClusterIP
#   ports:
#     admin-http:
#       port: 8081

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: myapp.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  #       portName: http
  tls: []

# ---------------------------------------------------------------------------
# OpenShift Route
# ---------------------------------------------------------------------------
route:
  enabled: false
  host: ""
  path: ""
  targetPort: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# ---------------------------------------------------------------------------
# Extra OpenShift Routes — MAP-BASED (keyed by route name), beyond the
# primary one above. For microservices fronting more than one hostname/path.
# ---------------------------------------------------------------------------
routes: {}
# admin-console:
#   enabled: true
#   host: admin.apps.cluster.example.com
#   targetPort: admin-http

# ---------------------------------------------------------------------------
# OpenShift SecurityContextConstraints — MAP-BASED (keyed by SCC name)
# ---------------------------------------------------------------------------
scc: {}
# restricted-custom:
#   allowPrivilegedContainer: false
#   allowPrivilegeEscalation: false
#   requiredDropCapabilities: [ALL]
#   runAsUser:
#     type: MustRunAsRange
#   seLinuxContext:
#     type: MustRunAs
#   fsGroup:
#     type: MustRunAs
#   supplementalGroups:
#     type: RunAsAny
#   volumes: [configMap, downwardAPI, emptyDir, persistentVolumeClaim, projected, secret]
#   allowHostNetwork: false
#   allowHostPorts: false
#   allowHostPID: false
#   allowHostIPC: false
#   readOnlyRootFilesystem: false
#   users:
#     - system:serviceaccount:myns:mysa
#   groups: []
#   priority: null

# ---------------------------------------------------------------------------
# ConfigMaps — MAP-BASED (keyed by configmap name)
# ---------------------------------------------------------------------------
configMaps: {}
# app-config:
#   data:
#     LOG_LEVEL: info
#     app.conf: |
#       key=value
#   annotations: {}
#   labels: {}

# ---------------------------------------------------------------------------
# Secrets — MAP-BASED (keyed by secret name)
# ---------------------------------------------------------------------------
secrets: {}
# app-secret:
#   type: Opaque
#   stringData:
#     DB_PASSWORD: "secret"

# ---------------------------------------------------------------------------
# External Secrets Operator (https://external-secrets.io) — requires the ESO
# CRDs installed on the cluster; this chart only renders the custom
# resources, not the operator. All three are MAP-BASED (keyed by name).
# ---------------------------------------------------------------------------
externalSecretsApiVersion: external-secrets.io/v1

# SecretStore — namespaced, defines where ExternalSecrets in THIS namespace
# pull from (Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret
# Manager, ...). Skip this if you already have one and just reference its
# name from externalSecrets below.
secretStores: {}
# vault-backend:
#   provider:
#     vault:
#       server: https://vault.example.com:8200
#       path: secret
#       version: v2
#       auth:
#         kubernetes:
#           mountPath: kubernetes
#           role: my-role
#           serviceAccountRef:
#             name: my-app

# ClusterSecretStore — cluster-scoped counterpart to SecretStore. Usually
# owned by a platform release, not by individual microservices — see the
# comment in templates/clustersecretstore.yaml before using this per-app.
clusterSecretStores: {}

# ExternalSecret — syncs remote keys into a REAL Kubernetes Secret (named
# after the map key by default) that the rest of this chart consumes
# exactly like any other Secret (env/envFrom/volumes reference it by name).
externalSecrets: {}
# db-credentials:
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore        # or ClusterSecretStore
#   refreshInterval: 1h
#   target:
#     name: db-credentials     # defaults to the map key
#     creationPolicy: Owner
#   data:
#     - secretKey: password
#       remoteRef:
#         key: secret/data/myapp/db
#         property: password

# ---------------------------------------------------------------------------
# PVCs — MAP-BASED (keyed by PVC name)
# ---------------------------------------------------------------------------
pvc: {}
# my-data:
#   accessModes: [ReadWriteOnce]
#   size: 10Gi
#   storageClassName: ""

# ---------------------------------------------------------------------------
# PersistentVolumes — MAP-BASED (keyed by PV name)
# ---------------------------------------------------------------------------
persistentVolumes: {}

# ---------------------------------------------------------------------------
# StorageClasses — MAP-BASED (keyed by SC name)
# ---------------------------------------------------------------------------
storageClasses: {}
# fast-ssd:
#   provisioner: ebs.csi.aws.com
#   parameters:
#     type: gp3

# ---------------------------------------------------------------------------
# StatefulSet volumeClaimTemplates — MAP-BASED (keyed by VCT name)
# ---------------------------------------------------------------------------
volumeClaimTemplates: {}
# data:
#   accessModes: [ReadWriteOnce]
#   size: 20Gi
#   storageClassName: fast-ssd

# ---------------------------------------------------------------------------
# CronJobs — MAP-BASED (keyed by cronjob name)
# ---------------------------------------------------------------------------
cronjobs: {}
# backup:
#   schedule: "0 2 * * *"
#   concurrencyPolicy: Forbid
#   jobTemplate:
#     backoffLimit: 3
#     restartPolicy: OnFailure
#     command: ["/bin/backup.sh"]

# ---------------------------------------------------------------------------
# Jobs — MAP-BASED (keyed by job name)
# ---------------------------------------------------------------------------
jobs: {}
# migrate:
#   command: ["python", "manage.py", "migrate"]
#   restartPolicy: OnFailure
#   backoffLimit: 3
#   annotations:
#     argocd.argoproj.io/hook: PreSync

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

# ---------------------------------------------------------------------------
# RBAC — MAP-BASED (keyed by role/binding name)
# ---------------------------------------------------------------------------
rbac:
  roles: {}
  # my-role:
  #   rules:
  #     - apiGroups: [""]
  #       resources: ["pods"]
  #       verbs: ["get", "list"]

  roleBindings: {}
  # my-rb:
  #   roleRef: my-role
  #   subjects:
  #     - kind: ServiceAccount
  #       name: my-sa

  clusterRoles: {}
  clusterRoleBindings: {}

# ---------------------------------------------------------------------------
# HPA
# ---------------------------------------------------------------------------
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  metrics: []
  behavior: {}

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# ---------------------------------------------------------------------------
pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# ---------------------------------------------------------------------------
# NetworkPolicies — MAP-BASED (keyed by policy name)
# ---------------------------------------------------------------------------
networkPolicies: {}
# allow-ingress:
#   podSelector: {}
#   policyTypes: [Ingress]
#   ingress:
#     - from:
#         - podSelector:
#             matchLabels:
#               app: frontend

# ---------------------------------------------------------------------------
# Prometheus ServiceMonitor
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  scheme: http
  tlsConfig: {}
  relabelings: []
  metricRelabelings: []

# ---------------------------------------------------------------------------
# VerticalPodAutoscaler
# ---------------------------------------------------------------------------
vpa:
  enabled: false
  updateMode: Auto
  resourcePolicy: {}

# ---------------------------------------------------------------------------
# Raw YAML injection
# ---------------------------------------------------------------------------
extraDeploy: []

# ---------------------------------------------------------------------------
# Checksums — Opt-in Pod Restart on Config Change
# ---------------------------------------------------------------------------
checksums:
  enabled: false